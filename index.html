<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>广东中考化学·满分冲刺 | 修正版</title>
    <style>
        :root {
            --primary: #2B6EF0;
            --primary-light: #5B8EF5;
            --primary-soft: #EBF2FE;
            --accent: #FF9F43;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --key-yellow: #FFF9C4;
            --key-border: #F9A825;
            --trap-orange: #FFF0E0;
            --trap-border: #E67E22;
            --card: #FFFFFF;
            --text: #1E293B;
            --border: #E2EAF5;
            --shadow: 0 4px 16px rgba(0,0,0,0.04);
            --radius-xl: 24px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, 'PingFang SC', 'Segoe UI', 'Noto Sans', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #EEF2FF 0%, #E0E7FF 50%, #F0F4FF 100%);
            color: #1E293B;
            line-height: 1.6;
            font-size: 15px;
            min-height: 100vh;
            padding: 12px 0 50px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 0 14px; }

        .header {
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 50%, #2563EB 100%);
            border-radius: 28px;
            padding: 22px 18px;
            margin-bottom: 18px;
            color: white;
            box-shadow: 0 12px 28px rgba(30,64,175,0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            top: -40px;
            right: -30px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .header-icon { font-size: 42px; margin-bottom: 4px; position: relative; z-index: 1; }
        .header h1 { font-size: 1.3rem; font-weight: 700; position: relative; z-index: 1; }
        .header p { font-size: 0.7rem; opacity: 0.88; margin-top: 2px; position: relative; z-index: 1; }

        .card {
            background: var(--card);
            border-radius: var(--radius-xl);
            padding: 18px 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid rgba(59,130,246,0.06);
        }
        .card h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 10px;
            border-left: 4px solid var(--primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 18px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.18s;
            cursor: pointer;
            background: #F1F5F9;
            color: #334155;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(43,110,240,0.28); }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: #F59E0B; color: #1E293B; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-sm { padding: 7px 14px; font-size: 0.78rem; }
        .btn-xs { padding: 5px 10px; font-size: 0.7rem; }
        .btn-block { width: 100%; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

        .hidden { display: none !important; }

        .module-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .module-card {
            background: linear-gradient(135deg, #EBF2FE 0%, #F5F8FF 100%);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1.5px solid rgba(43,110,240,0.2);
            position: relative;
        }
        .module-card:active { transform: scale(0.95); background: #DCE8FF; border-color: var(--primary); }
        .module-card .emoji { font-size: 2rem; display: block; }
        .module-card .name { font-weight: 700; font-size: 0.82rem; margin-top: 4px; color: #1E3A8A; }
        .module-card .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #EF4444;
            color: white;
            font-size: 0.6rem;
            padding: 2px 7px;
            border-radius: 20px;
            font-weight: 700;
        }

        .question-header { display: flex; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
        .tag {
            background: #EEF2FF;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #2B6EF0;
        }
        .tag-green { background: #D1FAE5; color: #059669; }
        .tag-gd {
            background: #FEF3C7;
            color: #B45309;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 4px;
            font-weight: 700;
        }

        .material-box {
            background: linear-gradient(135deg, #FFFDF5 0%, #FFF9E6 100%);
            border-left: 5px solid var(--accent);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            line-height: 1.7;
            color: #4A3728;
        }
        .material-box .mat-title {
            font-weight: 800;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 6px;
            color: #D97706;
        }
        .material-box .flow {
            background: #FFF;
            border: 1px dashed #E5C07B;
            padding: 10px 12px;
            border-radius: 12px;
            margin: 8px 0;
            text-align: center;
            font-size: 0.82rem;
            color: #5C4033;
        }
        .material-box ul { list-style: none; padding: 0; margin: 6px 0; }
        .material-box ul li {
            padding: 3px 0 3px 18px;
            position: relative;
        }
        .material-box ul li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: bold;
        }

        .question-text {
            font-weight: 700;
            background: #F8FAFF;
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 14px;
            border: 1px solid #E6EDF8;
            font-size: 0.9rem;
        }

        .options-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .option-item {
            border: 2px solid #E6EDF8;
            border-radius: 50px;
            padding: 11px 16px;
            background: white;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.88rem;
        }
        .option-item:active { background: #F5F8FF; }
        .option-item.selected { border-color: var(--primary); background: #EBF2FE; }
        .option-item.correct { border-color: var(--success); background: #D1FAE5; }
        .option-item.wrong { border-color: var(--danger); background: #FEE2E2; }
        .option-letter {
            width: 30px;
            height: 30px;
            min-width: 30px;
            background: #F1F5F9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8rem;
        }

        .feedback {
            margin-top: 10px;
            padding: 12px 14px;
            border-radius: 16px;
            display: none;
            font-size: 0.85rem;
            line-height: 1.6;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .feedback.show { display: block; }
        .feedback.correct-fb { background: #F0FDF4; border-left: 5px solid var(--success); }
        .feedback.wrong-fb { background: #FFF5F5; border-left: 5px solid var(--danger); }
        .feedback .key-point {
            display: inline-block;
            background: var(--key-yellow);
            border-left: 3px solid var(--key-border);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            margin: 4px 2px;
            font-size: 0.82rem;
        }
        .feedback .trap-point {
            display: inline-block;
            background: var(--trap-orange);
            border-left: 3px solid var(--trap-border);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            margin: 4px 2px;
            font-size: 0.82rem;
        }

        .thinking-panel {
            margin-top: 10px;
            border: 2px dashed #CBD5E1;
            border-radius: 16px;
            overflow: hidden;
        }
        .thinking-header {
            background: #F8FAFC;
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 0.82rem;
            color: #475569;
            user-select: none;
            -webkit-user-select: none;
        }
        .thinking-header:active { background: #EEF2FF; }
        .thinking-body {
            padding: 12px 14px;
            background: #FFFBEB;
            font-size: 0.8rem;
            line-height: 1.7;
            display: none;
            border-top: 1px solid #FDE68A;
        }
        .thinking-body.open { display: block; }
        .thinking-body .step {
            padding: 3px 0 3px 22px;
            position: relative;
            margin: 2px 0;
        }
        .thinking-body .step::before {
            content: attr(data-num);
            position: absolute;
            left: 0;
            top: 3px;
            width: 18px;
            height: 18px;
            background: #F59E0B;
            color: white;
            border-radius: 50%;
            font-size: 0.65rem;
            text-align: center;
            line-height: 18px;
            font-weight: 700;
        }
        .thinking-body .breakthrough {
            background: #FEF3C7;
            padding: 6px 10px;
            border-radius: 8px;
            margin-top: 6px;
            font-weight: 700;
        }

        .result-card { text-align: center; }
        .result-emoji { font-size: 3rem; }
        .result-score { font-size: 2rem; font-weight: 800; color: #1E40AF; }
        .accuracy-bar {
            height: 10px;
            background: #E2E8F0;
            border-radius: 20px;
            margin: 12px auto;
            overflow: hidden;
            max-width: 300px;
        }
        .accuracy-fill {
            height: 100%;
            background: linear-gradient(90deg, #3B82F6, #2563EB);
            border-radius: 20px;
            transition: width 0.6s;
        }

        .wrong-item {
            background: #FFF5F5;
            border-left: 4px solid var(--danger);
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 14px;
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1E293B;
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 0.82rem;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: slideUp 0.3s;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-icon">🧪🏆</div>
        <h1>广东中考化学·满分冲刺</h1>
        <p>11模块·110题·全选择·已修正</p>
    </div>

    <div id="main-menu">
        <div class="card">
            <h2>📚 选择模块</h2>
            <div id="module-grid-container" class="module-grid"></div>
            <div class="btn-row" style="margin-top:14px;">
                <button class="btn btn-outline btn-sm" onclick="showStatistics()">📊 学习统计</button>
                <button class="btn btn-warning btn-sm" onclick="showWrongBook()">📖 错题本</button>
                <button class="btn btn-outline btn-sm" onclick="resetAllData()">🔄 重置</button>
            </div>
        </div>
    </div>

    <div id="quiz-area" class="card hidden">
        <div class="question-header">
            <span class="tag" id="quiz-chapter">模块</span>
            <span class="tag tag-green" id="quiz-progress">0/0</span>
        </div>
        <div id="material-box" class="material-box hidden">
            <span class="mat-title">📖 题干材料</span>
            <div id="material-text"></div>
        </div>
        <div class="question-text" id="quiz-question"></div>
        <ul class="options-list" id="quiz-options"></ul>
        <div class="feedback" id="quiz-feedback">
            <div id="feedback-text"></div>
            <div id="feedback-exp" style="margin-top:6px;"></div>
        </div>
        <div id="thinking-area"></div>
        <div class="btn-row" style="margin-top:12px;">
            <button class="btn btn-primary hidden" id="btn-next" onclick="nextQuestion()">下一题 →</button>
            <button class="btn btn-success hidden" id="btn-finish" onclick="finishQuiz()">🏁 完成</button>
            <button class="btn btn-outline btn-sm" onclick="confirmQuit()">← 退出</button>
        </div>
    </div>

    <div id="result-area" class="card hidden result-card">
        <div class="result-emoji" id="result-emoji">🎉</div>
        <div id="result-name" style="font-size:1.2rem;font-weight:700;"></div>
        <div class="result-score" id="result-score"></div>
        <div class="accuracy-bar"><div class="accuracy-fill" id="accuracy-fill" style="width:0%;"></div></div>
        <p id="result-detail"></p>
        <div class="btn-group" style="margin-top:10px;">
            <button class="btn btn-warning" id="btn-retry-wrong" onclick="retryWrong()" style="display:none;">📘 重练错题</button>
            <button class="btn btn-primary" onclick="goToMenu()">🏠 返回</button>
        </div>
    </div>

    <div id="statistics-area" class="card hidden">
        <h2>📈 学习报告</h2>
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>总练习次数</span><span id="stat-total">0</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>正确总数</span><span id="stat-correct">0</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>正确率</span><span id="stat-accuracy">0%</span></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>错题数量</span><span id="stat-wrong">0</span></div>
        <h3 style="margin:14px 0 8px;">📌 各模块掌握度</h3>
        <div id="chapter-stats"></div>
        <button class="btn btn-outline btn-sm btn-block" onclick="goToMenu()" style="margin-top:10px;">← 返回</button>
    </div>

    <div id="wrongbook-area" class="card hidden">
        <h2>📕 错题本</h2>
        <div id="wrong-list-container"></div>
        <button class="btn btn-outline btn-sm btn-block" style="margin-top:10px;" onclick="goToMenu()">← 返回</button>
    </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
// ======================= 11模块·110题·全选择题·已修正 =======================
const modulesDB = {};

// ==================== 模块1 空气 氧气 (10题) ====================
modulesDB["空气 氧气"] = [
    { q:"空气中体积分数约为21%的气体是？", ops:["氮气","氧气","二氧化碳","稀有气体"], ans:1, exp:"<span class='key-point'>氧气约占21%</span>，是支持燃烧和呼吸的关键气体。氮气占78%。" },
    { q:"下列物质在氧气中燃烧，产生大量白烟的是？", ops:["硫","红磷","铁丝","木炭"], ans:1, exp:"红磷燃烧生成<span class='key-point'>五氧化二磷(P₂O₅)固体</span>，形成白烟。硫生成SO₂气体，铁丝生成Fe₃O₄固体（火星四射），木炭生成CO₂气体。" },
    { q:"<span class='tag-gd'>广东真题</span> 下列关于氧气用途的说法错误的是？", ops:["医疗急救","炼钢","作燃料","潜水"], ans:2, exp:"<span class='key-point'>氧气具有助燃性，本身不可燃</span>，<span class='trap-point'>不能作燃料</span>。燃料必须是自身能燃烧的物质。", thinking:["氧气=助燃≠可燃","燃料必须自身能燃烧（如H₂、CO、CH₄）","氧气在炼钢中用于氧化杂质","突破口：区分'助燃'与'可燃'"] },
    { q:"实验室用加热氯酸钾和二氧化锰混合物制氧气，二氧化锰的作用是？", ops:["反应物","催化剂","干燥剂","吸收杂质"], ans:1, exp:"MnO₂是<span class='key-point'>催化剂</span>，加快反应速率，本身<span class='trap-point'>质量和化学性质不变</span>。" },
    { q:"用红磷测定空气中氧气含量，实验后发现进入集气瓶水体积大于1/5，可能的原因是？", ops:["红磷过量","止水夹未夹紧","未冷却读数","燃烧匙缓慢伸入"], ans:3, exp:"缓慢伸入导致<span class='trap-point'>瓶内气体受热膨胀逸出</span>，冷却后瓶内气压更小，进入的水更多→<span class='key-point'>结果偏大</span>。", thinking:["结果>1/5→瓶内气压偏小→气体逸出","缓慢伸入→红磷在瓶口就开始燃烧→气体受热膨胀逸出","止水夹未夹紧也会导致结果偏大（气体从导管逸出）","突破口：偏大=气体减少过多或逸出"] },
    { q:"该实验能否用木炭代替红磷？", ops:["能","不能","可以但需加水","任意"], ans:1, exp:"木炭燃烧生成CO₂气体，<span class='key-point'>瓶内压强几乎不变</span>，水不会倒流。替代物必须生成固体，或生成的气体能被完全吸收。" },
    { q:"<span class='tag-gd'>广东模拟</span> 下列属于空气污染物的是？", ops:["CO₂","N₂","SO₂","H₂O"], ans:2, exp:"<span class='key-point'>SO₂引起酸雨</span>，NOx、CO、O₃和PM2.5也是主要空气污染物。<span class='trap-point'>CO₂不是空气污染物</span>，是温室气体。" },
    { q:"工业制氧气利用的原理是？", ops:["化学变化","沸点不同","密度不同","溶解度不同"], ans:1, exp:"分离液态空气，利用<span class='key-point'>氮气(-196℃)和氧气(-183℃)沸点差异</span>。整个过程没有新物质生成，属于<span class='trap-point'>物理变化</span>。" },
    { q:"无色气体A能使带火星木条复燃，A与铁丝反应生成黑色固体B，则A是？", ops:["氧气","氮气","二氧化碳","氢气"], ans:0, exp:"O₂<span class='key-point'>助燃</span>，与Fe反应生成<span class='key-point'>Fe₃O₄</span>（黑色固体）。", thinking:["能使带火星木条复燃→O₂","O₂+Fe→点燃→Fe₃O₄（黑色）","突破口：助燃性+与铁生成黑色固体"] },
    { q:"下列措施有利于减缓空气污染的是？", ops:["工厂废气直接排放","露天焚烧秸秆","使用清洁能源和燃煤脱硫","以上都不是"], ans:2, exp:"<span class='key-point'>清洁能源减少排放，脱硫减少SO₂</span>。直接排放和焚烧都会加重污染。" }
];

// ==================== 模块2 水和溶液 (10题) ====================
modulesDB["水和溶液"] = [
    { q:"电解水实验中，负极产生的气体是？", ops:["氧气","氢气","水蒸气","氯气"], ans:1, exp:"<span class='key-point'>负极产生氢气，正极产生氧气</span>，体积比H₂:O₂=2:1。口诀：负氢正氧。" },
    { q:"下列物质溶于水，溶液温度明显升高的是？", ops:["硝酸铵","氯化钠","氢氧化钠","蔗糖"], ans:2, exp:"<span class='key-point'>NaOH、浓H₂SO₄溶解放热</span>（温度升高）；<span class='trap-point'>NH₄NO₃吸热降温</span>；NaCl和蔗糖温度变化不明显。" },

        ops:["将燃着的木条伸入集气瓶中验满","长颈漏斗末端伸入液面以下","用排水法收集CO₂","实验后先熄灭酒精灯再撤导管"],
        ans:1,
        exp:"<span class='key-point'>长颈漏斗末端必须液封</span>，防止气体逸出。<span class='trap-point'>验满应放在瓶口；CO₂能溶于水不能用排水法；应先撤导管后熄灯（防倒吸）</span>。",
        thinking:["验满CO₂：燃着木条放瓶口（不是伸入）","液封目的：防止气体从漏斗逸出","CO₂能溶于水→不用排水法","操作顺序：先撤导管后熄灯（防倒吸）"],
        breakthrough:"装置选择看药品状态和条件，收集方法看气体密度和溶解性"
    });

    return group;
})();

// ======================= 全局状态 =======================
var appState = {
    currentModule: null,
    questions: [],
    idx: 0,
    score: 0,
    totalScore: 0,
    wrongList: [],
    answered: false,
    stats: { total:0, correct:0, wrongBook:[], chapterStats:{} }
};

var STORAGE = 'chem_final_v3';

function saveStats() {
    try { localStorage.setItem(STORAGE, JSON.stringify(appState.stats)); } catch(e) {}
}

function loadStats() {
    var s = localStorage.getItem(STORAGE);
    if(s) {
        try {
            var d = JSON.parse(s);
            appState.stats = d;
            if(!appState.stats.wrongBook) appState.stats.wrongBook = [];
            if(!appState.stats.chapterStats) appState.stats.chapterStats = {};
        } catch(e) {}
    }
}

function resetAllData() {
    if(confirm('确定要重置所有学习记录和错题本吗？此操作不可恢复。')) {
        appState.stats = { total:0, correct:0, wrongBook:[], chapterStats:{} };
        saveStats();
        goToMenu();
        showToast('数据已重置');
    }
}

function addToWrongBook(q, moduleName) {
    var item = {
        text: (q.q || q.question).replace(/<[^>]*>/g,''),
        correctAns: q.ans,
        options: q.ops,
        explanation: q.exp,
        material: q.material,
        module: moduleName
    };
    if(!appState.stats.wrongBook.some(function(w) { return w.text === item.text && w.module === item.module; })) {
        appState.stats.wrongBook.push(item);
        saveStats();
    }
}

function removeFromWrongBook(qText, moduleName) {
    appState.stats.wrongBook = appState.stats.wrongBook.filter(
        function(w) { return !(w.text === qText && w.module === moduleName); }
    );
    saveStats();
}

function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(t._timeout);
    t._timeout = setTimeout(function() { t.classList.add('hidden'); }, 1800);
}

function hideAll() {
    ['main-menu','quiz-area','result-area','statistics-area','wrongbook-area'].forEach(function(id) {
        var e = document.getElementById(id);
        if(e) e.classList.add('hidden');
    });
}

function showEl(id) {
    var e = document.getElementById(id);
    if(e) e.classList.remove('hidden');
}

function goToMenu() {
    hideAll();
    showEl('main-menu');
    renderModuleGrid();
}

function renderModuleGrid() {
    var grid = document.getElementById('module-grid-container');
    if(!grid) return;
    grid.innerHTML = '';
    var names = Object.keys(modulesDB);
    var emojis = ['🌬️','💧','🔥','⚙️','⚗️','🍎','📝','🔬','🥼','🧪','🔍'];
    for(var i = 0; i < names.length; i++) {
        var name = names[i];
        var count = modulesDB[name].length;
        var div = document.createElement('div');
        div.className = 'module-card';
        div.innerHTML = '<span class="emoji">' + emojis[i] + '</span><div class="name">' + name + '</div><div>' + count + '题</div>';
        if(i === 10) div.innerHTML += '<span class="badge">综合</span>';
        div.onclick = (function(n) { return function() { startModule(n); }; })(name);
        grid.appendChild(div);
    }
}

function startModule(name) {
    appState.currentModule = name;
    appState.questions = modulesDB[name].slice();
    appState.idx = 0;
    appState.score = 0;
    appState.totalScore = appState.questions.length;
    appState.wrongList = [];
    appState.answered = false;
    startQuiz();
}

function startQuiz() {
    hideAll();
    showEl('quiz-area');
    document.getElementById('btn-next').classList.add('hidden');
    document.getElementById('btn-finish').classList.add('hidden');
    renderQ();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQ() {
    if(appState.idx >= appState.questions.length) {
        finishQuiz();
        return;
    }
    var q = appState.questions[appState.idx];
    document.getElementById('quiz-chapter').textContent = appState.currentModule;
    document.getElementById('quiz-progress').textContent = (appState.idx + 1) + '/' + appState.totalScore + '题';

    var mbDiv = document.getElementById('material-box');
    if(q.material) {
        mbDiv.classList.remove('hidden');
        document.getElementById('material-text').innerHTML = q.material;
    } else {
        mbDiv.classList.add('hidden');
    }

    document.getElementById('quiz-question').innerHTML = q.q || q.question;

    var optsDiv = document.getElementById('quiz-options');
    optsDiv.innerHTML = '';
    var letters = ['A','B','C','D'];
    for(var i = 0; i < q.ops.length; i++) {
        var li = document.createElement('li');
        li.className = 'option-item';
        li.innerHTML = '<span class="option-letter">' + letters[i] + '</span><span>' + q.ops[i] + '</span>';
        li.onclick = (function(idx) { return function() { selectChoice(idx); }; })(i);
        optsDiv.appendChild(li);
    }

    appState.answered = false;
    var fb = document.getElementById('quiz-feedback');
    fb.classList.remove('show','correct-fb','wrong-fb');
    document.getElementById('feedback-text').innerHTML = '';
    document.getElementById('feedback-exp').innerHTML = '';
    document.getElementById('thinking-area').innerHTML = '';
    document.getElementById('btn-next').classList.add('hidden');
    document.getElementById('btn-finish').classList.add('hidden');
}

function selectChoice(idx) {
    if(appState.answered) return;
    var q = appState.questions[appState.idx];
    var correct = (idx === q.ans);
    appState.answered = true;

    var items = document.querySelectorAll('.option-item');
    for(var i = 0; i < items.length; i++) {
        items[i].style.pointerEvents = 'none';
        if(i === q.ans) items[i].classList.add('correct');
        if(i === idx && !correct) items[i].classList.add('wrong');
        if(i === idx) items[i].classList.add('selected');
    }

    var fb = document.getElementById('quiz-feedback');
    fb.classList.add('show');
    var fbText = document.getElementById('feedback-text');
    var expDiv = document.getElementById('feedback-exp');

    if(correct) {
        fb.classList.add('correct-fb');
        var encourages = ['🎉 太棒了！','🌟 完全正确！','💪 功底扎实！','✨ 优秀！','👏 就是这个！'];
        fbText.innerHTML = encourages[Math.floor(Math.random()*encourages.length)] + ' 回答正确！';
        appState.score++;
    } else {
        fb.classList.add('wrong-fb');
        fbText.innerHTML = '❌ 答错了。正确答案是 <b>' + String.fromCharCode(65+q.ans) + '</b>。已加入错题本。';
        appState.wrongList.push(q);
        addToWrongBook(q, appState.currentModule);
    }
    expDiv.innerHTML = '<strong>📖 解析：</strong>' + q.exp;

    if(q.thinking && q.thinking.length > 0) {
        var area = document.getElementById('thinking-area');
        var panel = document.createElement('div');
        panel.className = 'thinking-panel';
        var header = document.createElement('div');
        header.className = 'thinking-header';
        header.innerHTML = '🧠 解题思维路径 <span style="font-size:0.7rem;">点击展开▼</span>';
        header.onclick = function() {
            var body = panel.querySelector('.thinking-body');
            var isOpen = body.classList.contains('open');
            if(isOpen) {
                body.classList.remove('open');
                header.querySelector('span').textContent = '点击展开▼';
            } else {
                body.classList.add('open');
                header.querySelector('span').textContent = '点击收起▲';
            }
        };
        var body = document.createElement('div');
        body.className = 'thinking-body';
        for(var i = 0; i < q.thinking.length; i++) {
            var step = document.createElement('div');
            step.className = 'step';
            step.setAttribute('data-num', i+1);
            step.textContent = q.thinking[i];
            body.appendChild(step);
        }
        if(q.breakthrough) {
            var bt = document.createElement('div');
            bt.className = 'breakthrough';
            bt.innerHTML = '🎯 <b>突破口：</b>' + q.breakthrough;
            body.appendChild(bt);
        }
        panel.appendChild(header);
        panel.appendChild(body);
        area.appendChild(panel);
    }

    appState.stats.total++;
    if(correct) appState.stats.correct++;
    var chap = appState.currentModule;
    if(!appState.stats.chapterStats[chap]) appState.stats.chapterStats[chap] = { total:0, correct:0 };
    appState.stats.chapterStats[chap].total++;
    if(correct) appState.stats.chapterStats[chap].correct++;
    if(correct) removeFromWrongBook((q.q || q.question).replace(/<[^>]*>/g,''), appState.currentModule);
    saveStats();

    if(appState.idx < appState.totalScore - 1) {
        document.getElementById('btn-next').classList.remove('hidden');
    } else {
        document.getElementById('btn-finish').classList.remove('hidden');
    }
}

function nextQuestion() {
    appState.idx++;
    appState.answered = false;
    renderQ();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function finishQuiz() {
    hideAll();
    showEl('result-area');
    var total = appState.totalScore;
    var correct = appState.score;
    var acc = Math.round(correct/total*100);
    document.getElementById('result-score').textContent = correct + ' / ' + total;
    document.getElementById('accuracy-fill').style.width = acc + '%';
    document.getElementById('result-detail').textContent = '正确率 ' + acc + '%';

    if(acc >= 85) {
        document.getElementById('result-emoji').textContent = '🏆';
        document.getElementById('result-name').textContent = '冲刺满分！实力强劲！';
    } else if(acc >= 60) {
        document.getElementById('result-emoji').textContent = '📘';
        document.getElementById('result-name').textContent = '稳步前进，继续加油！';
    } else {
        document.getElementById('result-emoji').textContent = '📚';
        document.getElementById('result-name').textContent = '夯实基础，查漏补缺！';
    }

    var retry = document.getElementById('btn-retry-wrong');
    if(appState.wrongList.length > 0) {
        retry.style.display = 'flex';
        retry.textContent = '📘 重练错题（' + appState.wrongList.length + '题）';
    } else {
        retry.style.display = 'none';
    }
}

function retryWrong() {
    if(appState.wrongList.length > 0) {
        appState.questions = appState.wrongList.slice();
        appState.idx = 0;
        appState.score = 0;
        appState.totalScore = appState.questions.length;
        appState.wrongList = [];
        appState.answered = false;
        startQuiz();
    }
}

function showStatistics() {
    hideAll();
    showEl('statistics-area');
    document.getElementById('stat-total').textContent = appState.stats.total;
    document.getElementById('stat-correct').textContent = appState.stats.correct;
    var acc = appState.stats.total ? Math.round(appState.stats.correct/appState.stats.total*100) : 0;
    document.getElementById('stat-accuracy').textContent = acc + '%';
    document.getElementById('stat-wrong').textContent = appState.stats.wrongBook.length;
    var div = document.getElementById('chapter-stats');
    div.innerHTML = '';
    for(var mod in appState.stats.chapterStats) {
        var data = appState.stats.chapterStats[mod];
        var rate = data.total ? Math.round(data.correct/data.total*100) : 0;
        div.innerHTML += '<div style="margin-top:8px;display:flex;justify-content:space-between;"><span>' + mod + '</span><span>' + rate + '% (' + data.correct + '/' + data.total + ')</span></div><div class="accuracy-bar"><div class="accuracy-fill" style="width:' + rate + '%;height:6px;"></div></div>';
    }
}

function showWrongBook() {
    hideAll();
    showEl('wrongbook-area');
    var container = document.getElementById('wrong-list-container');
    container.innerHTML = '';
    if(appState.stats.wrongBook.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:#64748B;">🎉 错题本为空！继续保持！</div>';
    } else {
        for(var i = 0; i < appState.stats.wrongBook.length; i++) {
            var item = appState.stats.wrongBook[i];
            var div = document.createElement('div');
            div.className = 'wrong-item';
            div.innerHTML = '<strong>' + (i+1) + '. ' + item.text + '</strong><br>' +
                '<span style="font-size:0.7rem;color:#64748B;">模块：' + item.module + '</span><br>' +
                '<span style="font-size:0.75rem;">✅ 正确答案：' + String.fromCharCode(65+item.correctAns) + '</span><br>' +
                '<span style="font-size:0.72rem;">' + (item.explanation || '').replace(/<[^>]*>/g,'') + '</span>';
            var btn = document.createElement('button');
            btn.className = 'btn btn-success btn-xs';
            btn.style.marginTop = '6px';
            btn.textContent = '✅ 已掌握，删除';
            btn.onclick = (function(text, mod) {
                return function() {
                    removeFromWrongBook(text, mod);
                    showWrongBook();
                    showToast('已从错题本删除');
                };
            })(item.text, item.module);
            div.appendChild(btn);
            container.appendChild(div);
        }
    }
}

function confirmQuit() {
    if(confirm('确定要退出当前练习吗？进度将丢失。')) {
        goToMenu();
    }
}

loadStats();
renderModuleGrid();
goToMenu();
console.log('🧪 广东中考化学·修正版已就绪');

console.log('✅ 已修正：Ca(OH)₂溶解度反常题答案');
