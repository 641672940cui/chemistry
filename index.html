<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🧪 化学肌肉记忆训练</title>
    <style>
        /* ===== 全部样式保持不变 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-light: #94a3b8;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --radius-sm: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0 0 calc(80px + var(--safe-bottom)) 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        .app-header {
            width: 100%;
            max-width: 480px;
            padding: 14px 16px 10px 16px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .header-title {
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-title span {
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .header-stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .header-stats .stat-value {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 14px;
        }
        .stat-value.green { color: var(--success); }
        .stat-value.red { color: var(--danger); }
        .stat-value.orange { color: var(--warning); }
        .progress-bar-wrap {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-light), var(--primary));
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        .main-card {
            width: 100%;
            max-width: 480px;
            padding: 0 14px;
            margin-top: 12px;
            flex: 1;
        }
        #homePage { display: block; }
        #homePage.hidden { display: none; }
        .home-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin: 4px 0 14px;
        }
        .home-title small {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-light);
            display: block;
            margin-top: 4px;
        }
        .block-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .block-btn {
            background: var(--card-bg);
            border: none;
            border-radius: var(--radius-sm);
            padding: 14px 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            touch-action: manipulation;
        }
        .block-btn:active { transform: scale(0.96); }
        .block-btn .emoji { font-size: 24px; display: block; margin-bottom: 2px; }
        .block-btn .name { font-weight: 700; font-size: 14px; color: var(--text-primary); }
        .block-btn .desc { font-size: 11px; color: var(--text-light); margin-top: 1px; }
        .block-btn .count {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
            background: var(--bg);
            display: inline-block;
            padding: 0 10px;
            border-radius: 12px;
        }
        .block-btn .badge-done { float: right; font-size: 12px; color: var(--success); }
        .block-btn.block-done { opacity: 0.7; }
        .block-btn.block-done .name::after { content: " ✅"; font-size: 13px; }

        #quizPage { display: none; }
        #quizPage.active { display: block; }

        .element-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        .element-nav .el-name { font-weight: 700; font-size: 18px; }
        .element-nav .el-progress { font-size: 13px; color: var(--text-secondary); }
        .element-nav .el-progress .done { color: var(--success); font-weight: 700; }
        .element-nav .el-progress .total { color: var(--text-light); }

        .knowledge-card {
            background: #eef2ff;
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-sm);
            margin-bottom: 14px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .knowledge-card .kc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }
        .knowledge-card .kc-header:active { background: rgba(79, 70, 229, 0.06); }
        .knowledge-card .kc-title { font-weight: 700; color: var(--primary-dark); font-size: 15px; }
        .knowledge-card .kc-toggle {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--primary-light);
            cursor: pointer;
            padding: 0 4px;
            transition: transform 0.3s;
        }
        .knowledge-card .kc-toggle.open { transform: rotate(180deg); }
        .knowledge-card .kc-body {
            padding: 0 14px 14px 14px;
            font-size: 13.5px;
            line-height: 1.8;
            color: var(--text-secondary);
            display: none;
        }
        .knowledge-card .kc-body.open { display: block; }
        .knowledge-card .kc-body table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
            margin-top: 6px;
        }
        .knowledge-card .kc-body table td,
        .knowledge-card .kc-body table th {
            padding: 4px 6px;
            border-bottom: 1px solid rgba(79, 70, 229, 0.15);
            text-align: left;
        }
        .knowledge-card .kc-body table th { font-weight: 600; color: var(--text-primary); }
        .knowledge-card .kc-body .memo-box {
            background: rgba(79, 70, 229, 0.08);
            padding: 8px 12px;
            border-radius: 8px;
            margin: 6px 0;
            color: var(--primary-dark);
            font-weight: 500;
        }

        .question-item {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 14px 16px 12px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        .question-item .q-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 6px;
        }
        .question-item .q-head .q-idx { font-weight: 600; color: var(--text-secondary); }
        .question-item .q-text {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .question-item .options { display: flex; flex-direction: column; gap: 8px; }
        .question-item .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 2px solid transparent;
            transition: all 0.15s ease;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            touch-action: manipulation;
        }
        .question-item .option:active { transform: scale(0.98); }
        .question-item .option .label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .question-item .option .text { flex: 1; }
        .question-item .option.selected-correct {
            border-color: var(--success);
            background: #f0fdf4;
        }
        .question-item .option.selected-correct .label {
            background: var(--success);
            color: white;
        }
        .question-item .option.selected-wrong {
            border-color: var(--danger);
            background: #fef2f2;
        }
        .question-item .option.selected-wrong .label {
            background: var(--danger);
            color: white;
        }
        .question-item .option.show-correct {
            border-color: var(--success);
            background: #f0fdf4;
        }
        .question-item .option.show-correct .label {
            background: var(--success);
            color: white;
        }
        .question-item .option.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .question-item .option.disabled.show-correct,
        .question-item .option.disabled.selected-correct,
        .question-item .option.disabled.selected-wrong {
            opacity: 1;
        }

        .question-item .feedback {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.6;
            display: none;
            animation: fadeSlide 0.2s ease;
        }
        .question-item .feedback.correct {
            display: block;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        .question-item .feedback.wrong {
            display: block;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        .question-item .feedback .fb-title { font-weight: 700; }
        .question-item .feedback .fb-tip { margin-top: 2px; font-size: 12px; opacity: 0.85; }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .element-done-banner {
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
        }
        .element-done-banner .big { font-size: 28px; font-weight: 700; color: var(--success); }
        .element-done-banner .sub { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 10px 14px calc(10px + var(--safe-bottom));
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
        }
        .bottom-nav .nav-left,
        .bottom-nav .nav-right {
            display: flex;
            gap: 8px;
            flex: 1;
        }
        .bottom-nav .nav-right { justify-content: flex-end; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            min-height: 42px;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.30);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            pointer-events: none;
            box-shadow: none;
        }
        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1.5px solid #e2e8f0;
        }
        .btn-outline:active { background: var(--bg); }
        .btn-danger-outline {
            background: transparent;
            color: var(--danger);
            border: 1.5px solid #fecaca;
        }
        .btn-danger-outline:active { background: #fef2f2; }
        .btn-home {
            background: transparent;
            color: var(--text-secondary);
            border: 1.5px solid #e2e8f0;
            padding: 10px 12px;
        }
        .btn-home:active { background: var(--bg); }
        .btn .badge {
            background: var(--danger);
            color: white;
            border-radius: 50%;
            padding: 0 6px;
            font-size: 11px;
            min-width: 18px;
            text-align: center;
            line-height: 18px;
        }
        .btn .badge.hidden { display: none; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.open { display: flex; }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 440px;
            width: 100%;
            max-height: 80vh;
            padding: 18px 16px 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.20);
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .modal-header h3 { font-size: 18px; font-weight: 700; }
        .modal-header .badge {
            background: var(--danger);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            line-height: 1;
            color: var(--text-light);
            cursor: pointer;
            padding: 0 4px;
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .modal-list li {
            padding: 10px 12px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            border-left: 3px solid var(--danger);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-list li .qid { color: var(--text-light); font-weight: 400; font-size: 12px; }
        .modal-empty {
            text-align: center;
            padding: 28px 0;
            color: var(--text-light);
            font-size: 14px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .modal-actions .btn { flex: 1; min-width: 60px; }

        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .flex { display: flex; }
        .gap-8 { gap: 8px; }
        .w-full { width: 100%; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- ===== 顶部栏 ===== -->
    <header class="app-header" id="appHeader">
        <div class="header-top">
            <div class="header-title">
                🧪 化学记忆
                <span id="totalBadge">133题</span>
            </div>
            <div class="header-stats" id="headerStats" style="display:none;">
                <div>✅ <span class="stat-value green" id="correctCount">0</span></div>
                <div>❌ <span class="stat-value red" id="wrongCount">0</span></div>
                <div>📊 <span class="stat-value orange" id="accuracyDisplay">0%</span></div>
            </div>
        </div>
        <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
    </header>

    <!-- ===== 主容器 ===== -->
    <main class="main-card" id="mainCard">

        <!-- 首页 -->
        <div id="homePage">
            <div class="home-title">
                📚 选择练习区块
                <small>每个元素独立页面 · 知识卡片可折叠</small>
            </div>
            <div class="block-grid" id="blockGrid"></div>
        </div>

        <!-- 答题页 -->
        <div id="quizPage">
            <div class="element-nav" id="elementNav">
                <span class="el-name" id="elName">氢</span>
                <span class="el-progress" id="elProgress">进度 <span class="done" id="elDone">0</span>/<span class="total" id="elTotal">5</span></span>
            </div>

            <div class="knowledge-card" id="knowledgeCard">
                <div class="kc-header" onclick="toggleKnowledge()">
                    <span class="kc-title" id="kcTitle">📖 氢元素 · 知识卡片</span>
                    <button class="kc-toggle" id="kcToggle">▼</button>
                </div>
                <div class="kc-body" id="kcBody"></div>
            </div>

            <div id="questionsContainer"></div>

            <div class="element-done-banner hidden" id="elementDoneBanner">
                <div class="big">🎉 元素完成！</div>
                <div class="sub" id="elementDoneDesc">已全部答对，继续下一元素</div>
            </div>
        </div>
    </main>

    <!-- ===== 底部导航 ===== -->
    <nav class="bottom-nav" id="bottomNav">
        <div class="nav-left">
            <button class="btn btn-home" onclick="goHome()">🏠</button>
            <button class="btn btn-outline" id="prevElBtn" onclick="prevElement()">◀ 上一元素</button>
        </div>
        <div class="nav-right">
            <button class="btn btn-primary" id="nextElBtn" onclick="nextElement()">下一元素 ▶</button>
            <button class="btn btn-danger-outline" id="wrongBtn" onclick="openWrongModal()">
                📕 <span class="badge hidden" id="wrongBadge">0</span>
            </button>
        </div>
    </nav>

    <!-- ===== 错题本弹窗 ===== -->
    <div class="modal-overlay" id="wrongModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📕 错题本</h3>
                <span class="badge" id="wrongModalBadge">0</span>
                <button class="modal-close" onclick="closeWrongModal()">✕</button>
            </div>
            <ul class="modal-list" id="wrongList">
                <li class="modal-empty">🎉 暂无错题</li>
            </ul>
            <div class="modal-actions">
                <button class="btn btn-success-outline" onclick="retryWrong()">🔁 重练</button>
                <button class="btn btn-outline" onclick="clearWrong()">🗑️ 清空</button>
                <button class="btn btn-primary" onclick="closeWrongModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  题库数据 — 每个元素一个对象
        // ============================================================
        const ELEMENTS = [{
            id: 1,
            block: 0,
            element: '氢',
            symbol: 'H',
            knowledge: {
                title: '📖 氢元素 · 知识卡片',
                body: `<table>
                    <tr><th>项目</th><th>内容</th></tr>
                    <tr><td>符号</td><td><b>H</b></td></tr>
                    <tr><td>原子结构</td><td>1（最外层1个电子）</td></tr>
                    <tr><td>常见化合价</td><td><b>+1</b>（多数化合物）、<b>-1</b>（金属氢化物中）</td></tr>
                    <tr><td>单质</td><td>H₂（氢气）</td></tr>
                    <tr><td>高中常考</td><td>还原金属氧化物；NaH中H为-1价；H₂具有可燃性和还原性</td></tr>
                </table>
                <div class="memo-box">💡 记忆口诀："氢是H，最外层1个电子，多数+1，金属氢化物中-1"</div>`
            },
            qs: [
                { q: '表示"氢"元素的符号是（ ）', opts: ['He', 'H', 'Hi', 'Ha'], ans: 1, tip: 'H是氢，He是氦' },
                { q: '氢原子最外层有（ ）个电子', opts: ['0', '1', '2', '3'], ans: 1, tip: '氢原子核外只有1个电子' },
                { q: '氢元素在H₂O中显（ ）价，在NaH中显（ ）价', opts: ['+1，-1', '-1，+1', '+1，0', '-1，-2'],
                ans: 0, tip: 'H₂O中+1，NaH中-1' },
                { q: '关于氢气的性质，下列说法正确的是（ ）', opts: ['具有助燃性', '具有可燃性和还原性', '是惰性气体',
                        '与水反应生成酸'
                    ], ans: 1, tip: '2H₂+O₂→2H₂O；CuO+H₂→Cu+H₂O' },
                { q: 'NaH中氢元素的化合价为（ ），与水反应产生（ ）', opts: ['+1，氧气', '-1，氢气', '+1，氢气',
                        '-1，氧气'
                    ], ans: 1, tip: 'NaH+H₂O→NaOH+H₂↑' }
            ]
        }, {
            id: 2,
            block: 0,
            element: '碳',
            symbol: 'C',
            knowledge: {
                title: '📖 碳元素 · 知识卡片',
                body: `<table>
                    <tr><th>项目</th><th>内容</th></tr>

                    <tr><td>化合价 ↑</td><td>被<b>氧化</b></td><td>做<b>还原剂</b></td><td>Na→Na⁺（0→+1）</td></tr>
                    <tr><td>化合价 ↓</td><td>被<b>还原</b></td><td>做<b>氧化剂</b></td><td>Cl₂→Cl⁻（0→-1）</td></tr>
                </table>
                <div style="background:#f0fdf4;padding:8px 12px;border-radius:8px;margin-top:8px;border:1px solid #bbf7d0;">

                    失电子（把包裹送出去）→ 化合价升高 → 被氧化<br>
                    得电子（收到包裹）→ 化合价降低 → 被还原
                </div>
                `
            },
            qs: [
                { q: '下列金属中，活泼性最强的是（ ）', opts: ['Na', 'Mg', 'Al', 'K'], ans: 3, tip: 'K>Na>Mg>Al' },
                { q: '不能与稀硫酸反应放出H₂的是（ ）', opts: ['Fe', 'Zn', 'Cu', 'Mg'], ans: 2, tip: 'Cu位于H之后' },
                { q: '2Na+2H₂O=2NaOH+H₂↑中，做还原剂的是（ ）', opts: ['Na', 'H₂O', 'NaOH', 'H₂'], ans: 0,
                    tip: 'Na从0→+1，做还原剂' },
                { q: 'Cl₂+2NaOH=NaCl+NaClO+H₂O中，Cl₂的作用是（ ）', opts: ['只有氧化性', '只有还原性',
                        '既做氧化剂又做还原剂', '既不做氧化剂也不做还原剂'
                    ], ans: 2, tip: 'Cl₂歧化为-1和+1' },
                { q: '下列反应中属于氧化还原反应的是（ ）', opts: ['NaOH+HCl=NaCl+H₂O',
                        'CaCO₃+2HCl=CaCl₂+H₂O+CO₂↑', '2Mg+CO₂=2MgO+C', 'Na₂SO₄+BaCl₂=BaSO₄↓+2NaCl'
                    ], ans: 2, tip: 'A、B、D无化合价变化' },
                { q: '离子方程式书写正确的是（ ）', opts: ['Na+H₂O=Na⁺+OH⁻+H₂↑', 'Fe+Cu²⁺=Fe²⁺+Cu',
                        'CO₃²⁻+2H⁺=CO₂↑+H₂O', 'Al+OH⁻=AlO₂⁻+H₂↑'
                    ], ans: 1, tip: 'B正确；A未配平；C中CaCO₃不拆；D未配平' },
                { q: '钠与水反应的化学方程式是（ ）', opts: ['2Na+2H₂O=2NaOH+H₂↑', 'Na+H₂O=NaOH+H₂↑',
                        '2Na+H₂O=Na₂O+H₂↑', 'Na+H₂O=NaOH+H₂O'
                    ], ans: 0, tip: '2Na+2H₂O=2NaOH+H₂↑' },
                { q: '铝与NaOH溶液反应的化学方程式是（ ）', opts: ['2Al+2NaOH+6H₂O=2Na[Al(OH)₄]+3H₂↑',
                        '2Al+2NaOH=2NaAlO₂+H₂↑', 'Al+NaOH+H₂O=NaAlO₂+H₂↑',
                        '2Al+6NaOH=2Na₃AlO₃+3H₂↑'
                    ], ans: 0, tip: '2Al+2NaOH+6H₂O=2Na[Al(OH)₄]+3H₂↑' },
                { q: '铁与硫酸铜溶液反应的方程式是（ ）', opts: ['Fe+CuSO₄=FeSO₄+Cu', '2Fe+3CuSO₄=Fe₂(SO₄)₃+3Cu',
                        'Fe+CuSO₄=Fe₂(SO₄)₃+Cu', 'Fe+CuSO₄=FeSO₄+CuO'
                    ], ans: 0, tip: 'Fe+CuSO₄=FeSO₄+Cu' },
                { q: '铜与浓硫酸加热反应的方程式是（ ）', opts: ['Cu+2H₂SO₄(浓)→CuSO₄+SO₂↑+2H₂O',
                        'Cu+H₂SO₄(浓)→CuSO₄+H₂↑', 'Cu+2H₂SO₄(浓)→CuSO₄+2H₂O+SO₂↑',
                        '2Cu+2H₂SO₄(浓)→2CuSO₄+2H₂O+SO₂↑'
                    ], ans: 0, tip: 'Cu+2H₂SO₄(浓)→CuSO₄+SO₂↑+2H₂O' },
                { q: '下列叙述正确的是（ ）', opts: ['金属单质只能做还原剂', '非金属单质只能做氧化剂', '所有金属都能与酸反应放出H₂',
                        '同种元素在不同化合物中化合价一定不同'
                    ], ans: 0, tip: 'A正确；B错（H₂、C可做还原剂）；C错；D错' },
                { q: '属于两性氢氧化物的是（ ）', opts: ['NaOH', 'Mg(OH)₂', 'Al(OH)₃', 'Fe(OH)₃'], ans: 2,
                    tip: 'Al(OH)₃是两性氢氧化物' },
                { q: '下列离子中氧化性最强的是（ ）', opts: ['Na⁺', 'Mg²⁺', 'Al³⁺', 'Ag⁺'], ans: 3,
                    tip: '金属越不活泼，对应阳离子氧化性越强' },
                { q: '属于置换反应且是氧化还原反应的是（ ）', opts: ['2Mg+CO₂→2MgO+C', 'NaOH+HCl=NaCl+H₂O',
                        '2H₂O₂=2H₂O+O₂↑', 'CaCO₃=CaO+CO₂↑'
                    ], ans: 0, tip: 'A是置换反应（单质+化合物→新单质+新化合物）' }
            ]
        }];

        // ============================================================
        //  区块定义
        // ============================================================
        const BLOCKS = [
            { id: 0, name: '常见非金属·上', emoji: '💨', desc: 'H · C · N · O' },
            { id: 1, name: '常见非金属·下', emoji: '⚡', desc: 'F · Si · P · S · Cl' },
            { id: 2, name: '碱金属·碱土金属', emoji: '🔥', desc: 'Na · K · Mg · Ca' },
            { id: 3, name: '铝与两性', emoji: '🪞', desc: 'Al' },
            { id: 4, name: '过渡金属·上', emoji: '⚙️', desc: 'Fe · Cu' },
            { id: 5, name: '过渡金属·下', emoji: '🔩', desc: 'Zn · Ag · Hg' },
            { id: 6, name: '原子团', emoji: '🧩', desc: 'OH⁻ NO₃⁻ SO₄²⁻ CO₃²⁻ NH₄⁺' },
            { id: 7, name: '高中重点综合', emoji: '🎯', desc: '氧化还原 · 离子反应 · 方程式' }
        ];

        // ============================================================
        //  应用状态
        // ============================================================
        const state = {
            currentBlock: -1,
            currentElementIdx: 0,
            answers: [],
            wrongSet: new Set(),
            correctCount: 0,
            wrongCount: 0,
            blockDone: new Array(BLOCKS.length).fill(false),
        };

        let flatQuestions = [];

        // ============================================================
        //  构建全局题目列表
        // ============================================================
        function buildFlatQuestions() {
            flatQuestions = [];
            ELEMENTS.forEach(el => {
                el.qs.forEach(q => {
                    flatQuestions.push({
                        elementId: el.id,
                        element: el.element,
                        symbol: el.symbol,
                        block: el.block,
                        q: q.q,
                        opts: q.opts,
                        ans: q.ans,
                        tip: q.tip,
                        _elRef: el,
                        _qRef: q
                    });
                });
            });
            state.answers = new Array(flatQuestions.length).fill(-1);
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function getElementIndices(elId) {
            const indices = [];
            flatQuestions.forEach((fq, idx) => {
                if (fq.elementId === elId) indices.push(idx);
            });
            return indices;
        }

        function getElementsByBlock(blockId) {
            return ELEMENTS.filter(el => el.block === blockId);
        }

        function checkElementDone(elId) {
            const indices = getElementIndices(elId);
            let allDone = true;
            indices.forEach(idx => {
                if (state.answers[idx] === -1) allDone = false;
            });
            return allDone;
        }

        function checkBlockDone(blockId) {
            const els = getElementsByBlock(blockId);
            let allDone = true;
            els.forEach(el => {
                if (!checkElementDone(el.id)) allDone = false;
            });
            return allDone;
        }

        // ============================================================
        //  DOM 引用
        // ============================================================
        const $ = id => document.getElementById(id);
        const homePage = $('homePage');
        const quizPage = $('quizPage');
        const blockGrid = $('blockGrid');
        const elName = $('elName');
        const elDone = $('elDone');
        const elTotal = $('elTotal');
        const kcTitle = $('kcTitle');
        const kcBody = $('kcBody');
        const kcToggle = $('kcToggle');
        const questionsContainer = $('questionsContainer');
        const elementDoneBanner = $('elementDoneBanner');
        const elementDoneDesc = $('elementDoneDesc');
        const prevElBtn = $('prevElBtn');
        const nextElBtn = $('nextElBtn');
        const correctCount = $('correctCount');
        const wrongCount = $('wrongCount');
        const accuracyDisplay = $('accuracyDisplay');
        const progressFill = $('progressFill');
        const wrongBadge = $('wrongBadge');
        const totalBadge = $('totalBadge');
        const wrongModal = $('wrongModal');
        const wrongList = $('wrongList');
        const wrongModalBadge = $('wrongModalBadge');

        let knowledgeOpen = false;

        // ============================================================
        //  首页渲染
        // ============================================================
        function renderHome() {
            homePage.classList.remove('hidden');
            quizPage.classList.remove('active');
            document.getElementById('headerStats').style.display = 'none';
            progressFill.style.width = '0%';
            totalBadge.textContent = flatQuestions.length + '题';

            let html = '';
            BLOCKS.forEach((b, i) => {
                const els = getElementsByBlock(i);
                let totalQ = 0,
                    doneQ = 0;
                els.forEach(el => {
                    const indices = getElementIndices(el.id);
                    totalQ += indices.length;
                    indices.forEach(idx => {
                        if (state.answers[idx] !== -1) doneQ++;
                    });
                });
                const progress = totalQ > 0 ? Math.round((doneQ / totalQ) * 100) : 0;
                const isDone = state.blockDone[i];

                html += `
                    <button class="block-btn ${isDone ? 'block-done' : ''}" onclick="enterBlock(${i})">
                        <span class="emoji">${b.emoji}</span>
                        <span class="name">${b.name}</span>
                        <span class="badge-done">${isDone ? '✅' : ''}</span>
                        <div class="desc">${b.desc}</div>
                        <span class="count">${doneQ}/${totalQ} · ${progress}%</span>
                    </button>
                `;
            });
            blockGrid.innerHTML = html;
            updateWrongBadge();
        }

        // ============================================================
        //  进入区块
        // ============================================================
        function enterBlock(blockId) {
            state.currentBlock = blockId;
            state.currentElementIdx = 0;

            const els = getElementsByBlock(blockId);
            if (els.length === 0) return;

            // 找第一个未完成的元素
            let firstUndone = 0;
            for (let i = 0; i < els.length; i++) {
                if (!checkElementDone(els[i].id)) { firstUndone = i; break; }
            }
            state.currentElementIdx = firstUndone;

            homePage.classList.add('hidden');
            quizPage.classList.add('active');
            document.getElementById('headerStats').style.display = 'flex';

            renderElement();
        }

        // ============================================================
        //  渲染当前元素（核心渲染函数）
        // ============================================================
        function renderElement() {
            const els = getElementsByBlock(state.currentBlock);
            if (state.currentElementIdx >= els.length) {
                showBlockComplete();
                return;
            }

            const el = els[state.currentElementIdx];
            const indices = getElementIndices(el.id);

            // 更新导航
            elName.textContent = `${el.symbol} · ${el.element}`;
            let doneQ = 0;
            indices.forEach(idx => {
                if (state.answers[idx] !== -1) doneQ++;
            });
            elDone.textContent = doneQ;
            elTotal.textContent = indices.length;

            // 知识卡片
            kcTitle.textContent = el.knowledge.title;
            kcBody.innerHTML = el.knowledge.body;
            // 保持折叠状态
            kcBody.classList.remove('open');
            knowledgeOpen = false;
            kcToggle.classList.remove('open');
            kcToggle.textContent = '▼';

            // 渲染题目
            let html = '';
            indices.forEach((gIdx, localIdx) => {
                const fq = flatQuestions[gIdx];
                const selected = state.answers[gIdx] !== -1 ? state.answers[gIdx] : -1;
                const isAnswered = selected !== -1;
                const isCorrect = isAnswered && selected === fq.ans;
                const labels = ['A', 'B', 'C', 'D'];

                let optsHtml = '';
                fq.opts.forEach((opt, oi) => {
                    let cls = 'option';
                    if (isAnswered) {
                        if (oi === fq.ans) cls += ' show-correct';
                        if (oi === selected && oi === fq.ans) cls += ' selected-correct';
                        if (oi === selected && oi !== fq.ans) cls += ' selected-wrong';
                        cls += ' disabled';
                    }
                    optsHtml += `
                        <div class="${cls}" data-gidx="${gIdx}" data-oi="${oi}" onclick="selectOption(${gIdx}, ${oi})">
                            <span class="label">${labels[oi]}</span>
                            <span class="text">${opt}</span>
                        </div>
                    `;
                });

                const fbClass = isAnswered ? (isCorrect ? 'correct' : 'wrong') : '';
                const fbDisplay = isAnswered ? 'block' : 'none';
                const fbTitleText = isAnswered ? (isCorrect ? '✅ 正确！' : '❌ 错误') : '';
                const fbTipText = isAnswered ? '💡 ' + fq.tip : '';

                html += `
                    <div class="question-item" data-qidx="${localIdx}">
                        <div class="q-head">
                            <span class="q-idx">第 ${localIdx+1} 题</span>
                            <span>${isAnswered ? (isCorrect ? '✅' : '❌') : '⏳'}</span>
                        </div>
                        <div class="q-text">${fq.q}</div>
                        <div class="options">${optsHtml}</div>
                        <div class="feedback ${fbClass}" style="display:${fbDisplay};">
                            <div class="fb-title">${fbTitleText}</div>
                            <div class="fb-tip">${fbTipText}</div>
                        </div>
                    </div>
                `;
            });
            questionsContainer.innerHTML = html;

            // 隐藏完成横幅
            elementDoneBanner.classList.add('hidden');

            // 检查是否全部完成
            const allDone = checkElementDone(el.id);
            if (allDone) {
                elementDoneBanner.classList.remove('hidden');
                elementDoneDesc.textContent = `✅ ${el.element} 的所有题目已完成！继续下一元素吧`;
                // 轻微滚动到横幅位置（只滚动到横幅，不跳到顶部）
                setTimeout(() => {
                    const banner = document.querySelector('.element-done-banner');
                    if (banner) {
                        const rect = banner.getBoundingClientRect();
                        const top = rect.top + window.pageYOffset - 80;
                        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
                    }
                }, 100);
            }

            updateNavButtons();
            updateStats();
            updateWrongBadge();

            // ★★★ 关键修改：移除自动滚动到顶部的代码 ★★★
            // 不再调用 window.scrollTo({ top: 0, behavior: 'smooth' })
            // 保持用户当前的滚动位置
        }

        // ============================================================
        //  选择选项
        // ============================================================
        function selectOption(gIdx, oi) {
            if (state.answers[gIdx] !== -1) return;

            const fq = flatQuestions[gIdx];
            const isCorrect = oi === fq.ans;

            state.answers[gIdx] = oi;
            if (isCorrect) {
                state.correctCount++;
            } else {
                state.wrongCount++;
                const key = fq.elementId + '_' + fq.q;
                state.wrongSet.add(key);
            }

            // 重新渲染当前元素（保持滚动位置）
            renderElement();
            updateStats();
            updateWrongBadge();
        }

        // ============================================================
        //  导航按钮
        // ============================================================
        function updateNavButtons() {
            const els = getElementsByBlock(state.currentBlock);
            prevElBtn.disabled = state.currentElementIdx === 0;
            prevElBtn.style.opacity = state.currentElementIdx === 0 ? '0.3' : '1';

            const isLast = state.currentElementIdx >= els.length - 1;
            const el = els[state.currentElementIdx];
            const allDone = el ? checkElementDone(el.id) : false;

            if (isLast && allDone) {
                nextElBtn.textContent = '🏁 完成区块';
            } else {
                nextElBtn.textContent = '下一元素 ▶';
            }
        }

        // ============================================================
        //  上一元素 / 下一元素
        // ============================================================
        function prevElement() {
            if (state.currentElementIdx > 0) {
                state.currentElementIdx--;
                renderElement();
            }
        }

        function nextElement() {
            const els = getElementsByBlock(state.currentBlock);
            const el = els[state.currentElementIdx];
            if (!el) return;

            const allDone = checkElementDone(el.id);
            if (!allDone) {
                const indices = getElementIndices(el.id);
                const notDone = indices.filter(idx => state.answers[idx] === -1);
                if (notDone.length > 0) {
                    alert(`还有 ${notDone.length} 道题未完成，请先完成再进入下一元素`);
                    return;
                }
            }

            if (state.currentElementIdx >= els.length - 1) {
                showBlockComplete();
                return;
            }

            state.currentElementIdx++;
            renderElement();
        }

        // ============================================================
        //  区块完成
        // ============================================================
        function showBlockComplete() {
            const b = BLOCKS[state.currentBlock];
            state.blockDone[state.currentBlock] = true;

            const els = getElementsByBlock(state.currentBlock);
            let correct = 0,
                wrong = 0;
            els.forEach(el => {
                const indices = getElementIndices(el.id);
                indices.forEach(idx => {
                    if (state.answers[idx] !== -1) {
                        if (state.answers[idx] === flatQuestions[idx].ans) correct++;
                        else wrong++;
                    }
                });
            });
            const total = correct + wrong;
            const acc = total === 0 ? 0 : Math.round((correct / total) * 100);

            questionsContainer.innerHTML = `
                <div style="background:var(--card-bg);border-radius:var(--radius);padding:30px 20px;text-align:center;box-shadow:var(--shadow);">
                    <div style="font-size:48px;margin-bottom:10px;">🎉</div>
                    <h2 style="font-size:22px;margin-bottom:6px;">区块完成！</h2>
                    <p style="color:var(--text-secondary);font-size:15px;">你完成了「${b.name}」的所有题目</p>
                    <div style="display:flex;justify-content:center;gap:24px;margin:16px 0 20px;">
                        <div><div style="font-size:28px;font-weight:800;color:var(--success);">${correct}</div><div style="font-size:12px;color:var(--text-light);">✅ 正确</div></div>
                        <div><div style="font-size:28px;font-weight:800;color:var(--danger);">${wrong}</div><div style="font-size:12px;color:var(--text-light);">❌ 错误</div></div>
                        <div><div style="font-size:28px;font-weight:800;color:var(--primary);">${acc}%</div><div style="font-size:12px;color:var(--text-light);">📊 正确率</div></div>
                    </div>
                    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                        <button class="btn btn-primary" onclick="goHome()">🏠 返回首页</button>
                        <button class="btn btn-outline" onclick="openWrongModal()">📕 错题本</button>
                    </div>
                </div>
            `;
            elementDoneBanner.classList.add('hidden');
            elName.textContent = '🎊 完成！';
            elDone.textContent = '✅';
            elTotal.textContent = '✅';
            nextElBtn.disabled = true;
            nextElBtn.style.opacity = '0.3';
            updateWrongBadge();
            updateStats();
        }

        // ============================================================
        //  知识卡片折叠
        // ============================================================
        function toggleKnowledge() {
            knowledgeOpen = !knowledgeOpen;
            kcBody.classList.toggle('open', knowledgeOpen);
            kcToggle.classList.toggle('open', knowledgeOpen);
            kcToggle.textContent = knowledgeOpen ? '▲' : '▼';
        }

        // ============================================================
        //  更新统计
        // ============================================================
        function updateStats() {
            let correct = 0,
                wrong = 0,
                answered = 0;
            for (let i = 0; i < flatQuestions.length; i++) {
                if (state.answers[i] !== -1) {
                    answered++;
                    if (state.answers[i] === flatQuestions[i].ans) correct++;
                    else wrong++;
                }
            }
            state.correctCount = correct;
            state.wrongCount = wrong;
            const acc = answered === 0 ? 0 : Math.round((correct / answered) * 100);

            correctCount.textContent = correct;
            wrongCount.textContent = wrong;
            accuracyDisplay.textContent = answered === 0 ? '0%' : acc + '%';
            progressFill.style.width = `${(answered / flatQuestions.length) * 100}%`;
        }

        // ============================================================
        //  错题本
        // ============================================================
        function updateWrongBadge() {
            const count = state.wrongSet.size;
            wrongBadge.textContent = count;
            wrongBadge.classList.toggle('hidden', count === 0);
        }

        function openWrongModal() {
            if (state.wrongSet.size === 0) {
                wrongList.innerHTML = '<li class="modal-empty">🎉 暂无错题</li>';
            } else {
                let html = '';
                state.wrongSet.forEach(key => {
                    const parts = key.split('_');
                    const elId = parseInt(parts[0]);
                    const qText = parts.slice(1).join('_');
                    const fq = flatQuestions.find(f => f.elementId === elId && f.q === qText);
                    if (fq) {
                        const idx = flatQuestions.indexOf(fq);
                        const userAns = state.answers[idx];
                        const correctLabel = ['A', 'B', 'C', 'D'][fq.ans];
                        html += `
                            <li>
                                <span>${fq.element} · ${fq.q.slice(0, 20)}${fq.q.length > 20 ? '...' : ''}</span>
                                <span class="qid">正确: ${correctLabel}</span>
                            </li>
                        `;
                    }
                });
                wrongList.innerHTML = html;
            }
            wrongModalBadge.textContent = state.wrongSet.size;
            wrongModal.classList.add('open');
        }

        function closeWrongModal() {
            wrongModal.classList.remove('open');
        }

        function retryWrong() {
            if (state.wrongSet.size === 0) return;
            const wrongKeys = Array.from(state.wrongSet);
            wrongKeys.forEach(key => {
                const parts = key.split('_');
                const elId = parseInt(parts[0]);
                const qText = parts.slice(1).join('_');
                const fq = flatQuestions.find(f => f.elementId === elId && f.q === qText);
                if (fq) {
                    const idx = flatQuestions.indexOf(fq);
                    state.answers[idx] = -1;
                }
            });
            state.wrongSet.clear();

            const firstKey = wrongKeys[0];
            const parts = firstKey.split('_');
            const firstElId = parseInt(parts[0]);
            const firstEl = ELEMENTS.find(e => e.id === firstElId);
            if (firstEl) {
                state.currentBlock = firstEl.block;
                const els = getElementsByBlock(firstEl.block);
                state.currentElementIdx = 0;
                for (let i = 0; i < els.length; i++) {
                    if (els[i].id === firstElId) { state.currentElementIdx = i; break; }
                }
                homePage.classList.add('hidden');
                quizPage.classList.add('active');
                document.getElementById('headerStats').style.display = 'flex';
                renderElement();
            }
            closeWrongModal();
            updateWrongBadge();
            updateStats();
        }

        function clearWrong() {
            state.wrongSet.clear();
            updateWrongBadge();
            closeWrongModal();
            updateStats();
        }

        // ============================================================
        //  返回首页
        // ============================================================
        function goHome() {
            state.currentBlock = -1;
            quizPage.classList.remove('active');
            homePage.classList.remove('hidden');
            document.getElementById('headerStats').style.display = 'none';
            BLOCKS.forEach((b, i) => {
                state.blockDone[i] = checkBlockDone(i);
            });
            renderHome();
        }

        // ============================================================
        //  键盘快捷键
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (homePage.classList.contains('hidden')) {
                if (e.key === 'ArrowRight') { e.preventDefault();
                    nextElement(); }
                if (e.key === 'ArrowLeft') { e.preventDefault();
                    prevElement(); }
                if (e.key === 'Escape') closeWrongModal();
            }
        });

        wrongModal.addEventListener('click', (e) => {
            if (e.target === wrongModal) closeWrongModal();
        });

        // ============================================================
        //  初始化
        // ============================================================
        function init() {
            buildFlatQuestions();
            renderHome();
            updateWrongBadge();
            console.log('🧪 化学肌肉记忆训练 v2 已启动！');
            console.log(`📚 共 ${flatQuestions.length} 道题，${BLOCKS.length} 个区块`);
            console.log('⌨️ 键盘: ← → 切换元素，ESC 关闭弹窗');
            console.log('📌 选完题目后页面不会跳动，停留在当前位置');
        }

        init();
    </script>

</body>
</html>
