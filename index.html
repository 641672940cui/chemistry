<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>广东中考化学·满分冲刺 | 10模块精编+错题本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, 'PingFang SC', 'Segoe UI', 'Noto Sans', sans-serif;
            background: linear-gradient(145deg, #EAF3FF 0%, #D9E6FF 100%);
            color: #1A2C3E;
            line-height: 1.5;
            font-size: 16px;
            min-height: 100vh;
            padding: 12px 0 40px;
        }
        :root {
            --primary: #2B6EF0;
            --primary-light: #5B8EF5;
            --primary-soft: #EBF2FE;
            --accent: #FF9F43;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --card: #FFFFFF;
            --text: #1E293B;
            --border: #E2EAF5;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            --radius-xl: 28px;
            --radius-lg: 20px;
        }
        .container { max-width: 560px; margin: 0 auto; padding: 0 14px; }
        .header {
            background: linear-gradient(135deg, #2B6EF0 0%, #1E4FB0 100%);
            border-radius: 32px;
            padding: 20px 18px;
            margin-bottom: 20px;
            color: white;
            box-shadow: 0 12px 24px rgba(43,110,240,0.25);
            text-align: center;
        }
        .header-icon { font-size: 44px; margin-bottom: 6px; }
        .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.3px; }
        .header p { font-size: 0.7rem; opacity: 0.85; margin-top: 4px; }
        .card {
            background: var(--card);
            border-radius: var(--radius-xl);
            padding: 20px 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(43,110,240,0.08);
        }
        .card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 12px;
            border-left: 4px solid var(--primary);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            cursor: pointer;
            background: #F0F4FA;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(43,110,240,0.3); }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-sm { padding: 8px 16px; font-size: 0.8rem; }
        .btn-block { width: 100%; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .module-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .module-card {
            background: var(--primary-soft);
            border-radius: 24px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(43,110,240,0.2);
        }
        .module-card:active { transform: scale(0.96); background: #E0EAFF; }
        .module-card span { font-size: 1.8rem; display: block; }
        .module-card .name { font-weight: 700; font-size: 0.85rem; margin-top: 6px; color: #1E3A8A; }
        .question-header { display: flex; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; }
        .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .tag { background: #EEF2FF; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; color: #2B6EF0; }
        .material-box {
            background: #FEFCE8;
            border-left: 5px solid var(--accent);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .question-text {
            font-weight: 700;
            background: #F8FAFF;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 18px;
            border: 1px solid #E6EDF8;
        }
        .options-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .option-item {
            border: 2px solid #E6EDF8;
            border-radius: 60px;
            padding: 12px 18px;
            background: white;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .option-item.selected { border-color: var(--primary); background: var(--primary-soft); }
        .option-item.correct { border-color: var(--success); background: #D1FAE5; }
        .option-item.wrong { border-color: var(--danger); background: #FEE2E2; }
        .option-letter {
            width: 32px; height: 32px;
            background: #F1F5F9;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }
        .feedback { margin-top: 18px; padding: 14px; border-radius: 20px; display: none; }
        .feedback.show { display: block; }
        .feedback.correct-fb { background: #D1FAE5; border-left: 5px solid var(--success); }
        .feedback.wrong-fb { background: #FEE2E2; border-left: 5px solid var(--danger); }
        .result-card { text-align: center; }
        .accuracy-bar { height: 10px; background: #E2E8F0; border-radius: 20px; margin: 12px 0; overflow: hidden; }
        .wrong-item {
            background: #FEF2F2;
            border-left: 4px solid var(--danger);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 16px;
        }
        .hidden { display: none !important; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #1E293B; color: white; padding: 10px 20px; border-radius: 60px;
            font-size: 0.85rem; z-index: 1000;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-icon">🧪🏆</div>
        <h1>广东中考化学·精编冲刺</h1>
        <p>10模块×10独立题 | 错题本 | 鼓励+讲解</p>
    </div>
    <div id="main-menu">
        <div class="card"><h2>📚 选择模块 (每模块10题)</h2><div id="module-grid-container" class="module-grid"></div>
        <div style="margin-top: 18px; display: flex; gap: 10px;">
            <button class="btn btn-outline btn-sm" onclick="showStatistics()">📊 学习统计</button>
            <button class="btn btn-warning btn-sm" onclick="showWrongBook()">📖 错题本</button>
            <button class="btn btn-outline btn-sm" onclick="resetAllData()">🔄 重置</button>
        </div></div>
    </div>
    <div id="quiz-area" class="card hidden">
        <div class="question-header"><span class="tag" id="quiz-chapter">模块</span><span id="quiz-progress">0/10</span></div>
        <div class="tag-row" id="quiz-tags"></div>
        <div id="material-box" class="material-box hidden"><span style="font-weight:bold;">📖 实验/情境材料</span><div id="material-text" style="margin-top:6px;"></div></div>
        <div class="question-text" id="quiz-question"></div>
        <ul class="options-list" id="quiz-options"></ul>
        <div class="feedback" id="quiz-feedback"><div id="feedback-text"></div><div id="feedback-exp" style="margin-top:8px; font-size:0.85rem;"></div></div>
        <div style="display: flex; gap: 12px; margin-top: 16px;">
            <button class="btn btn-primary hidden" id="btn-next" onclick="nextQuestion()">下一题 →</button>
            <button class="btn btn-success hidden" id="btn-finish" onclick="finishQuiz()">🏁 完成模块</button>
            <button class="btn btn-outline btn-sm" onclick="confirmQuit()">← 退出</button>
        </div>
    </div>
    <div id="result-area" class="card hidden result-card">
        <div class="result-emoji" id="result-emoji" style="font-size:3rem;">🎉</div>
        <div id="result-name" style="font-size:1.3rem; font-weight:700;"></div>
        <div class="result-score" id="result-score" style="font-size:2rem; font-weight:800;"></div>
        <div class="accuracy-bar"><div id="accuracy-fill" style="width:0%; height:100%; background:var(--primary); border-radius:20px;"></div></div>
        <p id="result-detail"></p><div class="btn-group" style="margin-top:12px;">
        <button class="btn btn-warning" id="btn-retry-wrong" onclick="retryWrong()" style="display:none;">📘 重练错题</button>
        <button class="btn btn-primary" onclick="goToMenu()">🏠 首页</button></div>
    </div>
    <div id="statistics-area" class="card hidden"><h2>📈 学习报告</h2>
        <div style="display:flex; justify-content:space-between;"><span>总练习次数</span><span id="stat-total">0</span></div>
        <div style="display:flex; justify-content:space-between;"><span>正确总数</span><span id="stat-correct">0</span></div>
        <div style="display:flex; justify-content:space-between;"><span>正确率</span><span id="stat-accuracy">0%</span></div>
        <div style="display:flex; justify-content:space-between;"><span>错题数量</span><span id="stat-wrong">0</span></div>
        <h3 style="margin:14px 0 8px;">📌 各模块掌握度</h3><div id="chapter-stats"></div>
        <button class="btn btn-outline btn-sm btn-block" onclick="goToMenu()">← 返回主页</button>
    </div>
    <div id="wrongbook-area" class="card hidden"><h2>📕 错题本</h2>
        <div id="wrong-list-container"></div>
        <button class="btn btn-outline btn-sm btn-block" style="margin-top:12px;" onclick="goToMenu()">← 返回主页</button>
    </div>
</div>
<div id="toast" class="toast hidden"></div>
<script>
    // ======================= 10个模块 × 10题 全部独立精心编制，无任何凑数 =======================
    const modulesDB = {};

    // 模块1 空气 氧气 (10题)
    modulesDB["空气 氧气"] = [
        { q:"空气中体积分数约为21%的气体是？", ops:["氮气","氧气","二氧化碳","稀有气体"], ans:1, exp:"氧气约占21%，是支持燃烧和呼吸的关键气体。", tip:"O₂ 21%" },
        { q:"下列物质在氧气中燃烧，产生大量白烟的是？", ops:["硫","红磷","铁丝","木炭"], ans:1, exp:"红磷燃烧生成五氧化二磷固体，形成白烟，常用于测定空气中氧气含量。", tip:"红磷+O₂→P₂O₅" },
        { q:"(广东真题) 下列关于氧气用途的说法错误的是？", ops:["医疗急救","炼钢","作燃料","潜水"], ans:2, exp:"氧气具有助燃性，本身不可燃，不能作燃料。", tip:"氧气支持燃烧，不燃烧" },
        { q:"实验室用加热氯酸钾和二氧化锰混合物制氧气，二氧化锰的作用是？", ops:["反应物","催化剂","干燥剂","吸收杂质"], ans:1, exp:"MnO₂是催化剂，加快反应速率，本身质量和化学性质不变。", tip:"催化剂" },
        { q:"【实验探究】用红磷测定空气中氧气含量，实验后发现进入集气瓶水体积大于1/5。可能的原因是？", ops:["红磷过量","止水夹未夹紧","未冷却读数","燃烧匙缓慢伸入"], ans:3, exp:"缓慢伸入导致瓶内气体受热膨胀逸出，冷却后气压差增大。", tip:"误差偏大原因" },
        { q:"该实验能否用木炭代替红磷？", ops:["能","不能","可以但需加水","任意"], ans:1, exp:"木炭燃烧生成CO₂气体，体积不减少，压强变化小。", tip:"替代物需生成固体或气体被吸收" },
        { q:"(广东模拟) 下列属于空气污染物的是？", ops:["CO₂","N₂","SO₂","H₂O"], ans:2, exp:"SO₂、NOx、CO、O₃和PM2.5是主要空气污染物。", tip:"SO₂引起酸雨" },
        { q:"工业制氧气利用的原理是？", ops:["化学变化","沸点不同","密度不同","溶解度不同"], ans:1, exp:"分离液态空气，利用氮气和氧气沸点差异，属于物理变化。", tip:"物理变化" },
        { q:"(推断题) 无色气体A能使带火星木条复燃，A与铁丝反应生成黑色固体B，则A是？", ops:["氧气","氮气","二氧化碳","氢气"], ans:0, exp:"O₂助燃，与Fe反应生成Fe₃O₄黑色固体。", tip:"氧气性质" },
        { q:"下列措施有利于减缓空气污染的是？", ops:["工厂废气直接排放","露天焚烧秸秆","使用清洁能源","燃煤脱硫","③④"], ans:4, exp:"清洁能源减少排放，脱硫减少SO₂。", tip:"环保措施" }
    ];
    // 模块2 水和溶液
    modulesDB["水和溶液"] = [
        { q:"电解水实验中，负极产生的气体是？", ops:["氧气","氢气","水蒸气","氯气"], ans:1, exp:"负极产生氢气，正极产生氧气，体积比2:1。", tip:"负氢正氧" },
        { q:"下列物质溶于水，溶液温度明显升高的是？", ops:["硝酸铵","氯化钠","氢氧化钠","蔗糖"], ans:2, exp:"NaOH、浓H₂SO₄溶解放热，NH₄NO₃吸热降温。", tip:"放热现象" },
        { q:"(广东中考) 将饱和石灰水变成不饱和溶液，可行的方法是？", ops:["加Ca(OH)₂","升温","降温","蒸发水"], ans:1, exp:"Ca(OH)₂溶解度随温度升高而降低，升温使饱和变不饱和。", tip:"反常溶解度" },
        { q:"(溶解度曲线) t℃时，KNO₃溶解度为30g，则100g水中最多溶解KNO₃的质量为？", ops:["30g","15g","60g","45g"], ans:0, exp:"溶解度定义:100g溶剂达到饱和时溶解的溶质质量。", tip:"30g/100g水" },
        { q:"配制50g 10%的氯化钠溶液，下列操作导致浓度偏小的是？", ops:["量取水仰视","称量时左码右物(未用游码)","氯化钠不纯","以上都是"], ans:3, exp:"仰视水多；放反质量偏小；杂质使溶质减少，都使浓度偏小。", tip:"误差分析" },
        { q:"(推断题) 有一种无色液体，加入少量二氧化锰后产生大量气泡，该液体是？", ops:["水","过氧化氢溶液","稀盐酸","酒精"], ans:1, exp:"H₂O₂在MnO₂催化下分解产生O₂。", tip:"过氧化氢" },
        { q:"(广东真题) 下列有关水的说法正确的是？", ops:["软水加入肥皂水产生浮渣","过滤能除去可溶性钙镁","活性炭吸附色素异味","蒸馏是净水程度最低"], ans:2, exp:"活性炭具有吸附性；硬水肥皂水浮渣多；过滤除不溶物；蒸馏净化程度最高。", tip:"水的净化" },
        { q:"t℃时，将20g某物质加入50g水中充分溶解，剩余5g固体，则该物质溶解度为？", ops:["30g","40g","25g","10g"], ans:0, exp:"溶解15g/50g水→30g/100g水", tip:"溶解度计算" },
        { q:"【实验探究】粗盐提纯实验包括溶解、过滤、蒸发三步。过滤时玻璃棒的作用是？", ops:["引流","搅拌","加速溶解","转移固体"], ans:0, exp:"玻璃棒在过滤中引流液体，防止液体溅出。", tip:"引流" },
        { q:"蒸发时，当蒸发皿中出现______时停止加热？", ops:["大量固体","较多固体","少量液体","水完全蒸干"], ans:1, exp:"利用余热蒸干，防止固体飞溅。", tip:"蒸发结晶" }
    ];
    // 模块3 碳和碳的氧化物 (10题)
    let mod3 = [];
    mod3.push({ q:"金刚石和石墨物理性质差异大的原因是？", ops:["碳原子排列不同","元素种类不同","原子质量不同","杂质不同"], ans:0, exp:"碳原子排列方式不同导致硬度、导电性差异。", tip:"同素异形体" });
    mod3.push({ q:"(广东中考) 下列气体中能引起温室效应的是？", ops:["CO₂","O₂","N₂","H₂"], ans:0, exp:"CO₂、CH₄等是主要温室气体。", tip:"温室效应" });
    mod3.push({ q:"检验CO₂气体的常用方法是？", ops:["燃着木条","带火星木条","澄清石灰水","紫色石蕊"], ans:2, exp:"CO₂使澄清石灰水变浑浊(CaCO₃沉淀)。", tip:"CO₂检验" });
    mod3.push({ q:"【实验探究】将CO₂通入紫色石蕊溶液，溶液变红，原因是？化学方程式为？", ops:["CO₂+H₂O=H₂CO₃","CO₂=CO₂","H₂CO₃=H₂O+CO₂","C+O₂=CO₂"], ans:0, exp:"CO₂与水反应生成碳酸，碳酸使石蕊变红。", tip:"碳酸酸性" });
    mod3.push({ q:"加热变红溶液，颜色恢复紫色，说明？", ops:["碳酸分解","CO₂逸出","石蕊挥发","水蒸发"], ans:0, exp:"H₂CO₃加热分解为CO₂和H₂O，酸性消失。", tip:"碳酸不稳定" });
    mod3.push({ q:"(广东真题) 除去CO中混有的少量CO₂，应通入？", ops:["灼热CuO","澄清石灰水","NaOH溶液","浓硫酸"], ans:2, exp:"NaOH吸收CO₂，CO不反应，可干燥后收集。", tip:"除杂原则" });
    mod3.push({ q:"(推断题) 黑色固体A在氧气中燃烧生成无色气体B，B使澄清石灰水变浑浊，A是？", ops:["木炭","铁粉","铜粉","红磷"], ans:0, exp:"C+O₂→CO₂，CO₂使石灰水变浑浊。", tip:"碳燃烧" });
    mod3.push({ q:"CO和CO₂化学性质不同是因为？", ops:["分子结构不同","原子排列不同","碳元素化合价不同","密度不同"], ans:0, exp:"分子构成决定性质，CO可燃，CO₂不可燃。", tip:"分子结构" });
    mod3.push({ q:"下列做法不符合低碳理念的是？", ops:["骑自行车","双面打印","焚烧落叶","随手关灯"], ans:2, exp:"焚烧产生CO₂和烟尘，增加碳排放。", tip:"低碳生活" });
    mod3.push({ q:"实验室制取CO₂用大理石和稀盐酸，长颈漏斗末端必须液封的目的是？", ops:["防止气体逸出","便于加酸","形成压强差","冷凝气体"], ans:0, exp:"液封防止CO₂从漏斗口逸出，保证气密性。", tip:"气密性" });
    modulesDB["碳和碳的氧化物"] = mod3;
    // 模块4 金属
    let mod4 = [];
    mod4.push({ q:"下列金属活动性最强的是？", ops:["Mg","Al","Fe","Cu"], ans:0, exp:"K>Ca>Na>Mg>Al>Zn>Fe>Sn>Pb>(H)>Cu>Hg>Ag>Pt>Au", tip:"活动性顺序" });
    mod4.push({ q:"铁生锈需要同时接触？", ops:["氧气","水","氧气和水","二氧化碳"], ans:2, exp:"铁与O₂和H₂O同时接触发生缓慢氧化。", tip:"铁生锈条件" });

    mod10.push({ q:"电解MgCl₂属于什么反应类型？", ops:["分解反应","化合反应","置换反应","复分解反应"], ans:0, exp:"一种物质生成两种物质。", tip:"分解反应" });
    modulesDB["综合实验探究"] = mod10;

    // 全局状态与错题本
    let appState = {
        currentModule: null, questions: [], idx: 0, score: 0, wrongList: [], answered: false,
        stats: { total:0, correct:0, wrongBook:[], chapterStats:{} }  // wrongBook存储错题对象
    };
    const STORAGE = 'chem_final_perfect';
    function saveStats() { localStorage.setItem(STORAGE, JSON.stringify(appState.stats)); }
    function loadStats() { let s = localStorage.getItem(STORAGE); if(s) { try{ let d=JSON.parse(s); appState.stats = d; if(!appState.stats.wrongBook) appState.stats.wrongBook=[]; if(!appState.stats.chapterStats) appState.stats.chapterStats={}; } catch(e){} } }
    function resetAllData() { if(confirm('重置所有学习记录和错题本？')){ appState.stats={total:0,correct:0,wrongBook:[],chapterStats:{}}; saveStats(); goToMenu(); showToast("数据已重置"); } }
    function addToWrongBook(q, moduleName) { 
        let item = { text: q.q || q.question, correctAns: q.ans, options: q.ops, explanation: q.exp, tip: q.tip, module: moduleName, material: q.material };
        if(!appState.stats.wrongBook.some(w=>w.text===item.text)) { appState.stats.wrongBook.push(item); saveStats(); }
    }
    function removeFromWrongBook(qText) { appState.stats.wrongBook = appState.stats.wrongBook.filter(w=>w.text!==qText); saveStats(); }
    function showToast(msg) { let t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),1800); }
    function hideAll() { ['main-menu','quiz-area','result-area','statistics-area','wrongbook-area'].forEach(id=>{ let e=document.getElementById(id); if(e) e.classList.add('hidden'); }); }
    function showEl(id) { document.getElementById(id).classList.remove('hidden'); }
    function goToMenu() { hideAll(); showEl('main-menu'); renderModuleGrid(); }
    function renderModuleGrid() { let grid=document.getElementById('module-grid-container'); grid.innerHTML=''; for(let name of Object.keys(modulesDB)){ let div=document.createElement('div'); div.className='module-card'; div.innerHTML=`<span>🧪</span><div class="name">${name}</div><div class="count">10题</div>`; div.onclick=()=>startModule(name); grid.appendChild(div); } }
    function startModule(name) { appState.currentModule=name; appState.questions=[...modulesDB[name]]; appState.idx=0; appState.score=0; appState.wrongList=[]; appState.answered=false; startQuiz(); }
    function startQuiz() { hideAll(); showEl('quiz-area'); document.getElementById('btn-next').classList.add('hidden'); document.getElementById('btn-finish').classList.add('hidden'); renderQ(); }
    function renderQ() { if(appState.idx>=appState.questions.length){ finishQuiz(); return; } let q=appState.questions[appState.idx]; document.getElementById('quiz-chapter').innerHTML=appState.currentModule; document.getElementById('quiz-progress').innerHTML=`${appState.idx+1}/10题`; let mbDiv=document.getElementById('material-box'); if(q.material) { mbDiv.classList.remove('hidden'); document.getElementById('material-text').innerHTML = q.material; } else mbDiv.classList.add('hidden'); let displayQuestion = (q.q || q.question); document.getElementById('quiz-question').innerHTML = displayQuestion; let optsDiv=document.getElementById('quiz-options'); optsDiv.innerHTML=''; let opts = q.ops; opts.forEach((opt,i)=>{ let li=document.createElement('li'); li.className='option-item'; li.innerHTML=`<span class="option-letter">${String.fromCharCode(65+i)}</span><span>${opt}</span>`; li.onclick=()=>selectChoice(i); optsDiv.appendChild(li); }); appState.answered=false; document.getElementById('quiz-feedback').classList.remove('show','correct-fb','wrong-fb'); document.getElementById('feedback-text').innerHTML=''; document.getElementById('feedback-exp').innerHTML=''; }
    function selectChoice(idx) { if(appState.answered) return; let q=appState.questions[appState.idx]; let correct=(idx===q.ans); appState.answered=true; let items=document.querySelectorAll('.option-item'); items.forEach((it,i)=>{ it.classList.add('disabled'); if(i===q.ans) it.classList.add('correct'); if(i===idx && !correct) it.classList.add('wrong'); if(i===idx) it.classList.add('selected'); }); let fb=document.getElementById('quiz-feedback'); fb.classList.add('show'); let fbText=document.getElementById('feedback-text'); let expDiv=document.getElementById('feedback-exp'); if(correct){ 
        fb.classList.add('correct-fb'); 
        let encourages = ["🎉 太棒了！","🌟 化学小天才！","💪 完全正确！","📚 功底扎实！","✨ 优秀！"];
        fbText.innerHTML = encourages[Math.floor(Math.random()*encourages.length)] + " 回答正确！";
        appState.score++; 
        // 从错题本中删除此题
        let qText = q.q || q.question;
        removeFromWrongBook(qText);
    } else { 
        fb.classList.add('wrong-fb'); 
        fbText.innerHTML = `❌ 很遗憾答错了。正确答案是 ${String.fromCharCode(65+q.ans)}。已加入错题本。`;
        appState.wrongList.push(q); 
        addToWrongBook(q, appState.currentModule);
    }
    expDiv.innerHTML = `<strong>📖 知识点讲解：</strong> ${q.exp} ${q.tip ? '<br>💡 记忆提示：'+q.tip : ''}`;
    appState.stats.total++; if(correct) appState.stats.correct++; let chap=appState.currentModule; if(!appState.stats.chapterStats[chap]) appState.stats.chapterStats[chap]={total:0,correct:0}; appState.stats.chapterStats[chap].total++; if(correct) appState.stats.chapterStats[chap].correct++; saveStats(); 
    if(appState.idx<9) document.getElementById('btn-next').classList.remove('hidden'); else document.getElementById('btn-finish').classList.remove('hidden'); }
    function nextQuestion() { appState.idx++; renderQ(); }
    function finishQuiz() { hideAll(); showEl('result-area'); let total=10, correct=appState.score, acc=Math.round(correct/total*100); document.getElementById('result-score').innerHTML=`${correct}/${total}`; document.getElementById('accuracy-fill').style.width=`${acc}%`; document.getElementById('result-detail').innerHTML=`正确率 ${acc}%`; let emoji=acc>=80?'🏆✨':acc>=60?'📘💪':'📚🌟'; document.getElementById('result-emoji').innerHTML=emoji; document.getElementById('result-name').innerHTML=acc>=80?'冲刺满分！':acc>=60?'稳步前进':'坚持练习！'; let retry=document.getElementById('btn-retry-wrong'); if(appState.wrongList.length) { retry.style.display='flex'; retry.innerText=`📘 重练本模块错题(${appState.wrongList.length}题)`; } else retry.style.display='none'; }
    function retryWrong() { if(appState.wrongList.length) { appState.questions=[...appState.wrongList]; appState.idx=0; appState.score=0; appState.wrongList=[]; startQuiz(); } }
    function showStatistics() { hideAll(); showEl('statistics-area'); document.getElementById('stat-total').innerText=appState.stats.total; document.getElementById('stat-correct').innerText=appState.stats.correct; let acc=appState.stats.total?Math.round(appState.stats.correct/appState.stats.total*100):0; document.getElementById('stat-accuracy').innerText=acc+'%'; document.getElementById('stat-wrong').innerText=appState.stats.wrongBook.length; let div=document.getElementById('chapter-stats'); div.innerHTML=''; for(let [mod,data] of Object.entries(appState.stats.chapterStats)){ let rate=data.total?Math.round(data.correct/data.total*100):0; div.innerHTML+=`<div style="margin-top:8px;">${mod}<span style="float:right">${rate}% (${data.correct}/${data.total})</span></div><div class="accuracy-bar"><div style="width:${rate}%;height:6px;background:#2B6EF0;"></div></div>`; } }
    function showWrongBook() { hideAll(); showEl('wrongbook-area'); let container=document.getElementById('wrong-list-container'); container.innerHTML=''; if(appState.stats.wrongBook.length===0){ container.innerHTML='<div style="text-align:center; padding:30px;">🎉 错题本为空！继续保持！</div>'; } else { appState.stats.wrongBook.forEach((item,idx)=>{ let div=document.createElement('div'); div.className='wrong-item'; div.innerHTML=`<strong>${idx+1}. ${item.text}</strong><br><span style="font-size:0.75rem;">正确答案: ${String.fromCharCode(65+item.correctAns)}<br>${item.explanation}</span><br><button class="btn btn-success btn-sm" style="margin-top:8px;" onclick="removeFromWrongBookAndRefresh('${item.text.replace(/'/g,"\\'")}')">✅ 已掌握，从错题本删除</button>`; container.appendChild(div); }); } }
    function removeFromWrongBookAndRefresh(qText) { removeFromWrongBook(qText); showWrongBook(); showToast("已从错题本删除"); }
    function confirmQuit() { if(confirm('退出当前练习？')) goToMenu(); }
    loadStats(); renderModuleGrid(); goToMenu();
</script>
</body>
</html>
