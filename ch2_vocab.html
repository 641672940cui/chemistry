<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>第二章 语言记忆 · 海水中的重要元素</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fb; color: #1a2332; padding: 16px 14px 100px 14px; min-height: 100vh; }
        .header { background: white; border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); position: sticky; top: 0; z-index: 10; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header-title { font-size: 18px; font-weight: 700; color: #1a2332; }
        .header-title span { color: #2563eb; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .header-home { font-size: 13px; color: #2563eb; background: #e6efff; padding: 5px 12px; border-radius: 20px; text-decoration: none; font-weight: 600; }
        .header-stats { font-size: 13px; color: #6b7a8f; background: #f0f2f5; padding: 4px 12px; border-radius: 20px; }
        .progress-bar-bg { width: 100%; height: 6px; background: #e8ecf1; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: #2563eb; border-radius: 4px; transition: width 0.4s ease; width: 0%; }
        .progress-label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #6b7a8f; margin-top: 4px; }
        .btn-reset-small { background: none; border: none; color: #6b7a8f; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px 8px; }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .filter-btn { flex-shrink: 0; padding: 6px 16px; border-radius: 20px; border: 1.5px solid #d0d7e2; background: white; font-size: 13px; color: #3d4e62; cursor: pointer; transition: all 0.2s; font-weight: 500; font-family: inherit; }
        .filter-btn.active { background: #2563eb; border-color: #2563eb; color: white; }
        .filter-btn.wrong-filter { border-color: #c0392b; color: #c0392b; }
        .filter-btn.wrong-filter.active { background: #c0392b; border-color: #c0392b; color: white; }
        .question-card { background: white; border-radius: 18px; padding: 24px 20px 20px 20px; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); animation: fadeUp 0.35s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .question-type { display: inline-block; font-size: 11px; font-weight: 600; color: #2563eb; background: #e6efff; padding: 2px 12px; border-radius: 12px; margin-bottom: 12px; }
        .question-section { display: inline-block; font-size: 11px; font-weight: 500; color: #6b7a8f; background: #f0f2f5; padding: 2px 10px; border-radius: 12px; margin-left: 8px; }
        .question-text { font-size: 17px; font-weight: 500; line-height: 1.8; margin: 10px 0 4px 0; color: #1a2332; }
        .question-text .blank { display: inline-block; min-width: 80px; border-bottom: 2px dashed #2563eb; margin: 0 4px; color: #2563eb; font-weight: 600; }
        .options { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 12px 0; }
        .option-btn { display: block; width: 100%; text-align: left; padding: 14px 16px; border-radius: 12px; border: 2px solid #e2e7ef; background: white; font-size: 15px; line-height: 1.6; color: #1a2332; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .option-btn.selected-correct { border-color: #2563eb; background: #e6efff; }
        .option-btn.selected-wrong { border-color: #c0392b; background: #fde8e6; }
        .option-btn.show-correct { border-color: #2563eb; background: #e6efff; }
        .option-btn.disabled { pointer-events: none; opacity: 0.8; }
        .option-label { display: inline-block; font-weight: 700; color: #6b7a8f; margin-right: 8px; }
        .explanation { background: #f8faff; border-radius: 12px; padding: 14px 16px; margin: 12px 0 6px 0; border-left: 4px solid #2563eb; display: none; font-size: 14px; line-height: 1.8; color: #2c3e50; }
        .explanation.show { display: block; }
        .tip-yellow { background: #fcf8e3; padding: 8px 12px; border-radius: 8px; border-left: 3px solid #f0ad4e; margin-top: 6px; }
        .tip-yellow strong { color: #8a6d3b; }
        .mnemonic { background: #eef3ff; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #1e40af; margin-top: 6px; border-left: 3px solid #2563eb; }
        .source-link { font-size: 12px; color: #2563eb; margin-top: 8px; padding: 6px 10px; background: #f0f5fa; border-radius: 6px; }
        .action-row { display: flex; gap: 10px; margin-top: 16px; }
        .btn-primary { flex: 1; padding: 14px; border: none; border-radius: 14px; background: #2563eb; color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; min-height: 48px; }
        .btn-primary:disabled { opacity: 0.4; }
        .complete-screen { text-align: center; padding: 40px 20px; }
        .complete-screen .big-icon { font-size: 56px; margin-bottom: 16px; }
        .complete-screen h2 { font-size: 22px; margin-bottom: 8px; }
        .complete-screen .score-big { font-size: 48px; font-weight: 700; color: #2563eb; margin: 16px 0; }
        .wrong-book-btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a2332; color: white; border: none; border-radius: 40px; padding: 12px 28px; font-size: 15px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.2); cursor: pointer; z-index: 100; font-family: inherit; display: none; align-items: center; gap: 8px; min-height: 48px; }
        .wrong-book-btn .badge { background: #c0392b; color: white; border-radius: 20px; padding: 0 10px; font-size: 13px; line-height: 22px; }
        .empty-state { text-align: center; padding: 40px 20px; color: #6b7a8f; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .status-badge { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 12px; margin-left: 8px; }
        .status-badge.done { background: #e6efff; color: #2563eb; }
        .status-badge.wrong { background: #fde8e6; color: #c0392b; }
        .wrong-tag { display: inline-block; background: #c0392b; color: white; font-size: 11px; padding: 1px 10px; border-radius: 12px; margin-left: 8px; }
        .fill-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .fill-row label { font-weight: 500; color: #3d4e62; min-width: 30px; }
        .fill-row input { flex: 1; min-width: 120px; padding: 12px 14px; border-radius: 10px; border: 2px solid #e2e7ef; font-size: 15px; font-family: inherit; background: white; color: #1a2332; min-height: 44px; }
        .fill-row input:focus { outline: none; border-color: #2563eb; }
        .fill-row input.correct { border-color: #2563eb; background: #e6efff; }
        .fill-row input.wrong { border-color: #c0392b; background: #fde8e6; }
        .fill-row input:disabled { opacity: 0.7; }
        .fill-row .correct-answer-hint { font-size: 14px; color: #2563eb; font-weight: 600; }
        .fill-input-area { margin: 14px 0 12px 0; }
        @media (max-width: 380px) { .question-text { font-size: 15px; } .option-btn { font-size: 14px; padding: 12px 14px; min-height: 44px; } .fill-row input { font-size: 14px; padding: 10px 12px; min-height: 40px; } }
        @media (min-width: 768px) { body { max-width: 480px; margin: 0 auto; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-title">🧪 语言记忆 · <span>第二章</span></div>
            <div class="header-right">
                <a class="header-home" href="index.html">🏠 首页</a>
                <div class="header-stats" id="statsLabel">0 / 0</div>
            </div>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-label">
            <span id="correctRate">✅ 正确率：--%</span>
            <span id="wrongCount">❌ 错题：0</span>
            <button class="btn-reset-small" onclick="resetProgress()">重置</button>
        </div>
    </div>

    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">📚 全部</button>
        <button class="filter-btn" data-filter="2.1">§2.1 钠及其化合物</button>
        <button class="filter-btn" data-filter="2.2">§2.2 氯及其化合物</button>
        <button class="filter-btn" data-filter="2.3">§2.3 物质的量</button>
        <button class="filter-btn wrong-filter" data-filter="wrong">📕 错题本</button>
    </div>

    <div id="questionContainer"></div>

    <button class="wrong-book-btn" id="wrongBookBtn">
        📕 错题本 <span class="badge" id="wrongBadge">0</span>
    </button>

    <script>
        var questionBank = [
            // ========== §2.1 钠及其化合物 ==========
            { id: 1, type: 'choice', section: '2.1', question: '钠与水反应的现象可以概括为（　）', options: ['浮熔游响红', '沉熔游响蓝', '浮熔静响红', '浮熔游响蓝'], correct: 0, explanation: '钠与水反应现象：浮（密度比水小）、熔（放热熔化）、游（H₂推动）、响（嘶嘶声）、红（生成NaOH使酚酞变红）。', mnemonic: '📝 口诀："浮熔游响红"', source: '§2.1 钠与水' },
            { id: 2, type: 'choice', section: '2.1', question: '钠在空气中加热，生成的产物是（　）', options: ['Na₂O', 'Na₂O₂', 'NaOH', 'Na₂CO₃'], correct: 1, explanation: '常温下钠与O₂生成Na₂O（白色）；加热/点燃时生成Na₂O₂（淡黄色）。', tip: '常温Na₂O，加热Na₂O₂。', source: '§2.1 钠与氧气' },
            { id: 3, type: 'choice', section: '2.1', question: '下列关于Na₂O和Na₂O₂的说法正确的是（　）', options: ['Na₂O是过氧化物', 'Na₂O₂是碱性氧化物', 'Na₂O₂与水反应生成O₂', 'Na₂O与水反应生成O₂'], correct: 2, explanation: 'Na₂O是碱性氧化物，与水反应生成NaOH；Na₂O₂是过氧化物，与水反应生成NaOH和O₂。', tip: 'Na₂O₂既是氧化剂又是还原剂（歧化反应）。', source: '§2.1 氧化钠与过氧化钠' },
            { id: 4, type: 'choice', section: '2.1', question: '碳酸氢钠受热分解的产物是（　）', options: ['Na₂CO₃ + H₂O', 'Na₂CO₃ + H₂O + CO₂', 'NaOH + CO₂', 'Na₂O + CO₂'], correct: 1, explanation: '2NaHCO₃ --Δ--> Na₂CO₃ + H₂O + CO₂↑。NaHCO₃不稳定，加热分解。', tip: 'NaHCO₃加热分解，Na₂CO₃稳定不分解。', source: '§2.1 碳酸钠与碳酸氢钠' },
            { id: 5, type: 'choice', section: '2.1', question: '焰色试验中，钾的焰色是（　）', options: ['黄色', '紫色', '红色', '绿色'], correct: 1, explanation: '钾的焰色是紫色，需要透过蓝色钴玻璃观察，滤去钠的黄光干扰。', tip: '钠黄色，钾紫色（透过蓝色钴玻璃）。', source: '§2.1 焰色试验' },
            { id: 6, type: 'fill', section: '2.1', question: '钠与水反应的离子方程式是【1】。', blanks: ['2Na + 2H₂O = 2Na⁺ + 2OH⁻ + H₂↑'], explanation: '钠与水反应：2Na + 2H₂O = 2NaOH + H₂↑，离子方程式：2Na + 2H₂O = 2Na⁺ + 2OH⁻ + H₂↑。', source: '§2.1 钠与水' },
            { id: 7, type: 'fill', section: '2.1', question: 'Na₂O₂与CO₂反应的化学方程式是【1】。', blanks: ['2Na₂O₂ + 2CO₂ = 2Na₂CO₃ + O₂'], explanation: 'Na₂O₂与CO₂反应生成Na₂CO₃和O₂，可用于潜水艇供氧。', tip: 'Na₂O₂既是氧化剂又是还原剂。', source: '§2.1 过氧化钠' },
            { id: 8, type: 'fill', section: '2.1', question: 'Na₂CO₃的俗名是【1】，NaHCO₃的俗名是【2】。', blanks: ['纯碱（或苏打）', '小苏打'], explanation: 'Na₂CO₃俗称纯碱或苏打，NaHCO₃俗称小苏打。', source: '§2.1 碳酸钠与碳酸氢钠' },
            { id: 9, type: 'fill', section: '2.1', question: 'NaHCO₃受热分解的化学方程式是【1】。', blanks: ['2NaHCO₃ --Δ--> Na₂CO₃ + H₂O + CO₂↑'], explanation: 'NaHCO₃不稳定，加热分解生成Na₂CO₃、H₂O和CO₂。', source: '§2.1 碳酸氢钠' },
            { id: 10, type: 'fill', section: '2.1', question: '焰色试验是【1】变化（填"物理"或"化学"）。', blanks: ['物理'], explanation: '焰色试验是元素的性质，没有新物质生成，是物理变化。', source: '§2.1 焰色试验' },

            // ========== §2.2 氯及其化合物 ==========
            { id: 11, type: 'choice', section: '2.2', question: '氯气的颜色是（　）', options: ['无色', '黄绿色', '红棕色', '蓝色'], correct: 1, explanation: '氯气是黄绿色气体，有刺激性气味，有毒，密度比空气大。', source: '§2.2 氯气物理性质' },
            { id: 12, type: 'choice', section: '2.2', question: '氯气与铁反应生成的产物是（　）', options: ['FeCl₂', 'FeCl₃', 'Fe₂O₃', 'Fe(OH)₃'], correct: 1, explanation: '氯气氧化性强，将铁氧化为+3价：2Fe + 3Cl₂ --Δ--> 2FeCl₃。', tip: '氯气与铁生成FeCl₃，不是FeCl₂。', source: '§2.2 氯气与金属' },
            { id: 13, type: 'choice', section: '2.2', question: '新制氯水中含有的粒子不包括（　）', options: ['Cl₂', 'HClO', 'H⁺', 'Na⁺'], correct: 3, explanation: '新制氯水成分：Cl₂、HClO、H₂O、H⁺、Cl⁻、ClO⁻、OH⁻。没有Na⁺（氯气溶于水，不是NaCl溶液）。', tip: '新制氯水是三分子四离子。', source: '§2.2 氯气与水' },
            { id: 14, type: 'choice', section: '2.2', question: '漂白粉的有效成分是（　）', options: ['CaCl₂', 'Ca(ClO)₂', 'CaO', 'Ca(OH)₂'], correct: 1, explanation: '漂白粉的主要成分是Ca(ClO)₂和CaCl₂，有效成分是Ca(ClO)₂。', tip: '漂白粉有效成分Ca(ClO)₂，漂白液有效成分NaClO。', source: '§2.2 漂白粉' },
            { id: 15, type: 'choice', section: '2.2', question: '检验Cl⁻的正确操作是（　）', options: ['加AgNO₃溶液', '加稀HNO₃酸化后再加AgNO₃', '加盐酸酸化后再加AgNO₃', '加Ba(NO₃)₂溶液'], correct: 1, explanation: '检验Cl⁻：先加稀HNO₃酸化，再加AgNO₃，产生白色沉淀（AgCl）。不能用盐酸酸化（引入Cl⁻）。', tip: '不能用盐酸酸化，SO₄²⁻干扰时先用Ba(NO₃)₂除去。', source: '§2.2 Cl⁻检验' },
            { id: 16, type: 'choice', section: '2.2', question: '氯气与NaOH溶液反应的产物是（　）', options: ['NaCl + H₂O', 'NaCl + NaClO + H₂O', 'NaClO₃ + H₂O', 'NaCl + O₂'], correct: 1, explanation: 'Cl₂ + 2NaOH = NaCl + NaClO + H₂O，用于制漂白液。', tip: '氯气与碱反应是歧化反应，Cl₂既是氧化剂又是还原剂。', source: '§2.2 氯气与碱' },
            { id: 17, type: 'fill', section: '2.2', question: '氯气与水反应的化学方程式是【1】。', blanks: ['Cl₂ + H₂O ⇌ HCl + HClO'], explanation: '氯气与水反应生成盐酸和次氯酸，是可逆反应。', tip: 'HClO是弱酸，具有强氧化性和漂白性。', source: '§2.2 氯气与水' },
            { id: 18, type: 'fill', section: '2.2', question: '漂白粉的制备方程式是【1】。', blanks: ['2Cl₂ + 2Ca(OH)₂ = Ca(ClO)₂ + CaCl₂ + 2H₂O'], explanation: '氯气与石灰乳反应制得漂白粉，主要成分Ca(ClO)₂和CaCl₂。', source: '§2.2 漂白粉' },
            { id: 19, type: 'fill', section: '2.2', question: 'HClO的三大性质是：弱酸性、【1】、不稳定性。', blanks: ['强氧化性'], explanation: 'HClO具有弱酸性、强氧化性（漂白、杀菌）、不稳定性（光照分解）。', source: '§2.2 次氯酸' },
            { id: 20, type: 'fill', section: '2.2', question: '检验Cl⁻时，产生白色沉淀的化学式是【1】。', blanks: ['AgCl'], explanation: 'Cl⁻ + Ag⁺ = AgCl↓（白色沉淀），不溶于稀硝酸。', source: '§2.2 Cl⁻检验' },

            // ========== §2.3 物质的量 ==========
            { id: 21, type: 'choice', section: '2.3', question: '物质的量的单位是（　）', options: ['克', '摩尔', '升', 'mol/L'], correct: 1, explanation: '物质的量的单位是摩尔（mol）。克是质量单位，升是体积单位，mol/L是浓度单位。', source: '§2.3 物质的量' },
            { id: 22, type: 'choice', section: '2.3', question: '阿伏加德罗常数的数值约为（　）', options: ['6.02×10²³', '6.02×10²²', '3.01×10²³', '1.204×10²⁴'], correct: 0, explanation: '阿伏加德罗常数N_A ≈ 6.02×10²³ mol⁻¹，表示1 mol任何粒子的粒子数。', source: '§2.3 阿伏加德罗常数' },
            { id: 23, type: 'choice', section: '2.3', question: '标准状况下，气体摩尔体积约为（　）', options: ['22.4 L', '22.4 L/mol', '24.5 L/mol', '1 mol/L'], correct: 1, explanation: '标准状况（0℃，101 kPa）下，气体摩尔体积Vm ≈ 22.4 L/mol。', tip: '22.4 L/mol仅适用于标准状况下的气体。', source: '§2.3 气体摩尔体积' },
            { id: 24, type: 'choice', section: '2.3', question: '配制一定物质的量浓度溶液时，关键仪器是（　）', options: ['烧杯', '量筒', '容量瓶', '试管'], correct: 2, explanation: '配制一定物质的量浓度溶液的关键仪器是容量瓶，用于准确配制一定体积的溶液。', source: '§2.3 物质的量浓度' },
            { id: 25, type: 'choice', section: '2.3', question: '下列关于摩尔质量的说法正确的是（　）', options: ['摩尔质量就是相对分子质量', '摩尔质量的单位是g/mol', '摩尔质量的单位是g', '摩尔质量与物质的质量相同'], correct: 1, explanation: '摩尔质量是单位物质的量的物质所具有的质量，单位是g/mol，数值等于相对分子质量（或相对原子质量）。', tip: '摩尔质量有单位g/mol，相对分子质量无单位。', source: '§2.3 摩尔质量' },
            { id: 26, type: 'fill', section: '2.3', question: '物质的量（n）、质量（m）、摩尔质量（M）的关系式是【1】。', blanks: ['n = m / M'], explanation: 'n = m / M，其中M的单位是g/mol。', source: '§2.3 摩尔质量' },
            { id: 27, type: 'fill', section: '2.3', question: '标准状况下，气体摩尔体积Vm ≈ 【1】L/mol。', blanks: ['22.4'], explanation: '标准状况（0℃，101 kPa）下，Vm ≈ 22.4 L/mol。', tip: '仅适用于标准状况下的气体。', source: '§2.3 气体摩尔体积' },
            { id: 28, type: 'fill', section: '2.3', question: '物质的量浓度（c）与物质的量（n）、溶液体积（V）的关系式是【1】。', blanks: ['c = n / V'], explanation: 'c = n / V，其中c的单位是mol/L，V是溶液体积（不是溶剂体积）。', source: '§2.3 物质的量浓度' },
            { id: 29, type: 'fill', section: '2.3', question: '1 mol 任何粒子的粒子数约为【1】个。', blanks: ['6.02×10²³'], explanation: '阿伏加德罗常数N_A ≈ 6.02×10²³ mol⁻¹。', source: '§2.3 阿伏加德罗常数' },
            { id: 30, type: 'fill', section: '2.3', question: '"1 mol 氧"的说法【1】（填"正确"或"错误"），因为必须指明【2】。', blanks: ['错误', '粒子种类'], explanation: '物质的量必须指明粒子种类，如"1 mol 氧原子"或"1 mol 氧分子"。', tip: '"1 mol 氧"是错误的，必须指明粒子种类。', source: '§2.3 物质的量' }
        ];

        var state = { filteredIds: [], answeredIds: new Set(), results: {}, wrongIds: [], currentQuestion: null, isAnswered: false, currentFilter: 'all', fillInputs: {} };
        var container = document.getElementById('questionContainer');
        var progressFill = document.getElementById('progressFill');
        var statsLabel = document.getElementById('statsLabel');
        var correctRateEl = document.getElementById('correctRate');
        var wrongCountEl = document.getElementById('wrongCount');
        var wrongBadge = document.getElementById('wrongBadge');
        var wrongBookBtn = document.getElementById('wrongBookBtn');

        function getFilteredIds(filter) { if (filter === 'all') return questionBank.map(function(q) { return q.id; }); if (filter === 'wrong') return state.wrongIds.slice(); return questionBank.filter(function(q) { return q.section === filter; }).map(function(q) { return q.id; }); }
        function shuffleArray(arr) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var temp = arr[i]; arr[i] = arr[j]; arr[j] = temp; } return arr; }
        function getQuestionById(id) { for (var i = 0; i < questionBank.length; i++) { if (questionBank[i].id === id) return questionBank[i]; } return null; }
        function getUnansweredIds(filteredIds) { var result = []; for (var i = 0; i < filteredIds.length; i++) { if (!state.answeredIds.has(filteredIds[i])) result.push(filteredIds[i]); } return result; }

        function updateStats() {
            var total = state.filteredIds.length; var done = state.answeredIds.size;
            var correctCount = 0, wrongCount = 0; var ids = Object.keys(state.results);
            for (var i = 0; i < ids.length; i++) { if (state.results[ids[i]] === true) correctCount++; else if (state.results[ids[i]] === false) wrongCount++; }
            var rate = done === 0 ? '--%' : Math.round((correctCount / done) * 100) + '%';
            statsLabel.textContent = done + ' / ' + total;
            progressFill.style.width = (total === 0 ? 0 : (done / total) * 100) + '%';
            correctRateEl.textContent = '✅ 正确率：' + rate;
            wrongCountEl.textContent = '❌ 错题：' + wrongCount;
            wrongBadge.textContent = state.wrongIds.length;
            wrongBookBtn.style.display = (state.wrongIds.length > 0 && state.currentFilter !== 'wrong') ? 'flex' : 'none';
            var idxData = JSON.parse(localStorage.getItem('chem_index_data') || '{"doneMap":{}}');
            idxData.doneMap['ch2_vocab'] = done;
            localStorage.setItem('chem_index_data', JSON.stringify(idxData));
        }

        function addToWrong(q, userAns) {
            if (state.wrongIds.indexOf(q.id) === -1) state.wrongIds.push(q.id);
            var wrongList = JSON.parse(localStorage.getItem('chem_wrong_list') || '[]');
            var exists = wrongList.some(function(w) { return w.chapter === 2 && w.type === 'vocab' && w.qId === q.id; });
            if (!exists) {
                var correctAns = q.type === 'choice' ? q.options[q.correct] : (q.blanks || []).join('、');
                wrongList.push({ chapter: 2, type: 'vocab', qId: q.id, question: q.question, userAnswer: userAns || '', correctAnswer: correctAns });
                localStorage.setItem('chem_wrong_list', JSON.stringify(wrongList));
            }
            updateStats();
        }
        function removeFromWrong(id) {
            var idx = state.wrongIds.indexOf(id); if (idx !== -1) state.wrongIds.splice(idx, 1);
            var wrongList = JSON.parse(localStorage.getItem('chem_wrong_list') || '[]');
            wrongList = wrongList.filter(function(w) { return !(w.chapter === 2 && w.type === 'vocab' && w.qId === id); });
            localStorage.setItem('chem_wrong_list', JSON.stringify(wrongList));
            updateStats();
        }

        function renderQuestion() {
            var filtered = state.filteredIds;
            if (filtered.length === 0) { if (state.currentFilter === 'wrong') container.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><p>错题本已清空！继续加油！</p></div>'; else container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>当前章节暂无题目</p></div>'; updateStats(); return; }
            var unanswered = getUnansweredIds(filtered); var total = filtered.length;
            if (unanswered.length === 0 && state.answeredIds.size >= total) {
                var correctCount = 0; var ids = Object.keys(state.results);
                for (var i = 0; i < ids.length; i++) { if (state.results[ids[i]] === true) correctCount++; }
                var rate = total === 0 ? 0 : Math.round((correctCount / total) * 100);
                container.innerHTML = '<div class="complete-screen"><div class="big-icon">🎉</div><h2>全部通关！</h2><p>第二章语言记忆已刷完</p><div class="score-big">' + rate + '%</div><p style="color:#6b7a8f;font-size:14px;">正确率 ' + rate + '% · 共 ' + total + ' 题</p><button class="btn-primary" style="margin-top:20px;max-width:200px;display:inline-block;" onclick="resetProgress()">🔄 重新开始</button></div>';
                updateStats(); return;
            }
            var targetId = unanswered.length > 0 ? unanswered[0] : filtered[filtered.length - 1];
            var q = getQuestionById(targetId);
            if (!q) { container.innerHTML = '<div class="empty-state"><p>题目加载失败</p></div>'; return; }
            state.currentQuestion = q; state.isAnswered = false;
            var html = '<div class="question-card">';
            var typeLabel = q.type === 'choice' ? '🎯 选择题' : '✍️ 填空题';
            var sectionName = ''; if (q.section === '2.1') sectionName = '§2.1 钠及其化合物'; else if (q.section === '2.2') sectionName = '§2.2 氯及其化合物'; else if (q.section === '2.3') sectionName = '§2.3 物质的量';
            html += '<span class="question-type">' + typeLabel + '</span>';
            html += '<span class="question-section">' + sectionName + '</span>';
            var isWrong = state.wrongIds.indexOf(q.id) !== -1;
            if (isWrong && state.currentFilter !== 'wrong') html += '<span class="wrong-tag">📕 错题</span>';
            if (state.answeredIds.has(q.id)) { if (state.results[q.id] === true) html += '<span class="status-badge done">✅ 已掌握</span>'; else if (state.results[q.id] === false) html += '<span class="status-badge wrong">❌ 需重练</span>'; }
            var displayText = q.question;
            if (q.type === 'fill' && q.blanks) { for (var b = 0; b < q.blanks.length; b++) { displayText = displayText.replace('【' + (b + 1) + '】', '<span class="blank">____</span>'); } }
            html += '<div class="question-text">' + displayText + '</div>';
            if (q.type === 'choice') {
                var labels = ['A', 'B', 'C', 'D'];
                html += '<div class="options">';
                for (var i = 0; i < q.options.length; i++) { html += '<button class="option-btn" onclick="answerChoice(' + i + ', ' + q.id + ')" id="choiceOpt_' + i + '"><span class="option-label">' + labels[i] + '.</span> ' + q.options[i] + '</button>'; }
                html += '</div>';
                html += '<div class="explanation" id="explanation_' + q.id + '">';
                html += '<span class="label">📖 解析：</span>' + q.explanation;
                if (q.tip) html += '<div class="tip-yellow"><strong>🟡 ' + q.tip + '</strong></div>';
                if (q.mnemonic) html += '<div class="mnemonic">' + q.mnemonic + '</div>';
                if (q.source) html += '<div class="source-link">📎 ' + q.source + '</div>';
                html += '</div>';
                html += '<div class="action-row"><button class="btn-primary" id="nextBtnChoice" onclick="nextQuestion()" disabled>下一题 →</button></div>';
            } else {
                html += '<div class="fill-input-area" id="fillArea">';
                for (var f = 0; f < q.blanks.length; f++) { var savedVal = state.fillInputs[q.id + '_' + f] || ''; html += '<div class="fill-row"><label>空' + (f + 1) + '：</label><input type="text" id="fill_' + q.id + '_' + f + '" placeholder="输入答案" value="' + savedVal + '" autocomplete="off"><span class="correct-answer-hint" id="fillHint_' + q.id + '_' + f + '" style="display:none;"></span></div>'; }
                html += '</div>';
                html += '<div class="action-row"><button class="btn-primary" id="fillSubmitBtn" onclick="submitFill()">✅ 提交答案</button></div>';
                html += '<div class="explanation" id="explanation_' + q.id + '">';
                html += '<span class="label">📖 解析：</span>' + q.explanation;
                if (q.tip) html += '<div class="tip-yellow"><strong>🟡 ' + q.tip + '</strong></div>';
                if (q.mnemonic) html += '<div class="mnemonic">' + q.mnemonic + '</div>';
                if (q.source) html += '<div class="source-link">📎 ' + q.source + '</div>';
                html += '</div>';
                html += '<div class="action-row"><button class="btn-primary" id="nextBtnFill" onclick="nextQuestion()" disabled>下一题 →</button></div>';
            }
            html += '</div>';
            container.innerHTML = html; updateStats();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (q.type === 'fill') { setTimeout(function() { var inputs = document.querySelectorAll('.fill-row input'); inputs.forEach(function(inp, idx) { inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); if (idx === inputs.length - 1) submitFill(); else inputs[idx + 1].focus(); } }); }); if (inputs.length > 0 && !state.isAnswered) inputs[0].focus(); }, 100); }
        }

        window.answerChoice = function(selected, qId) {
            if (state.isAnswered) return; var q = getQuestionById(qId); if (!q) return; state.isAnswered = true;
            var isCorrect = (selected === q.correct); var btns = document.querySelectorAll('.option-btn');
            btns.forEach(function(b) { b.classList.add('disabled'); });
            if (isCorrect) { btns[selected].classList.add('selected-correct'); state.results[qId] = true; }
            else { btns[selected].classList.add('selected-wrong'); btns[q.correct].classList.add('show-correct'); state.results[qId] = false; addToWrong(q, q.options[selected]); }
            state.answeredIds.add(qId);
            var exp = document.getElementById('explanation_' + qId); if (exp) exp.classList.add('show');
            if (state.currentFilter === 'wrong' && isCorrect) removeFromWrong(qId);
            var nextBtn = document.getElementById('nextBtnChoice'); if (nextBtn) nextBtn.disabled = false;
            updateStats();
        };

        window.submitFill = function() {
            if (state.isAnswered) return; var q = state.currentQuestion; if (!q || q.type !== 'fill') return;
            var allCorrect = true, allFilled = true, userAnswers = [];
            for (var i = 0; i < q.blanks.length; i++) {
                var input = document.getElementById('fill_' + q.id + '_' + i); if (!input) { allFilled = false; continue; }
                var userVal = input.value.trim(); userAnswers.push(userVal); state.fillInputs[q.id + '_' + i] = userVal;
                if (userVal === '') { allFilled = false; continue; }
                var normalizedUser = userVal.replace(/\s/g, ''); var normalizedAnswer = q.blanks[i].replace(/\s/g, '');
                if (normalizedUser === normalizedAnswer) input.classList.add('correct');
                else { input.classList.add('wrong'); allCorrect = false; var hint = document.getElementById('fillHint_' + q.id + '_' + i); if (hint) { hint.style.display = 'inline'; hint.textContent = '→ 正确答案：' + q.blanks[i]; } }
                input.disabled = true;
            }
            if (!allFilled) { alert('请填写所有空再提交'); return; }
            state.isAnswered = true;
            if (allCorrect) state.results[q.id] = true;
            else { state.results[q.id] = false; addToWrong(q, userAnswers.join('、')); }
            state.answeredIds.add(q.id);
            var exp = document.getElementById('explanation_' + q.id); if (exp) exp.classList.add('show');
            if (state.currentFilter === 'wrong' && allCorrect) removeFromWrong(q.id);
            var submitBtn = document.getElementById('fillSubmitBtn'); if (submitBtn) submitBtn.disabled = true;
            var nextBtn = document.getElementById('nextBtnFill'); if (nextBtn) nextBtn.disabled = false;
            updateStats();
        };

        window.nextQuestion = function() { var q = state.currentQuestion; if (q && q.type === 'fill') { for (var i = 0; i < q.blanks.length; i++) { var inp = document.getElementById('fill_' + q.id + '_' + i); if (inp) state.fillInputs[q.id + '_' + i] = inp.value; } } renderQuestion(); };
        window.resetProgress = function() { if (!confirm('确定重置所有进度吗？（错题本也会清空）')) return; state.answeredIds = new Set(); state.results = {}; state.wrongIds = []; state.fillInputs = {}; var wrongList = JSON.parse(localStorage.getItem('chem_wrong_list') || '[]'); wrongList = wrongList.filter(function(w) { return !(w.chapter === 2 && w.type === 'vocab'); }); localStorage.setItem('chem_wrong_list', JSON.stringify(wrongList)); setFilter('all'); };

        function setFilter(filter) {
            state.currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.filter === filter); });
            if (filter === 'wrong') state.filteredIds = state.wrongIds.slice();
            else { state.filteredIds = getFilteredIds(filter); shuffleArray(state.filteredIds); }
            renderQuestion();
        }

        document.querySelectorAll('.filter-btn').forEach(function(btn) { btn.addEventListener('click', function() { var filter = this.dataset.filter; if (filter === 'wrong' && state.wrongIds.length === 0) { alert('🎉 错题本为空！继续保持！'); return; } setFilter(filter); }); });
        document.getElementById('wrongBookBtn').addEventListener('click', function() { if (state.wrongIds.length === 0) { alert('🎉 错题本是空的！继续保持！'); return; } setFilter('wrong'); });

        function init() { state.filteredIds = getFilteredIds('all'); shuffleArray(state.filteredIds); renderQuestion(); }
        init();
        console.log('🧪 第二章语言记忆已启动！共 ' + questionBank.length + ' 题');
    </script>
</body>
</html>
